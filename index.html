<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROE - Resource Optimization Engine</title>
<!-- Vendored via CDN. Feature-detected on boot; app degrades gracefully if these fail to load (see ROE.ui.checkVendors). -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" onerror="window.__ROE_CHART_FAILED=true"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" onerror="window.__ROE_XLSX_FAILED=true"></script>
<style>
:root{
  --bg:#12151b; --bg-alt:#171b23; --surface:#1d222b; --surface-2:#242a35;
  --border:#2c3340; --text:#e6e9ef; --text-dim:#9aa4b2; --text-faint:#6b7484;
  --accent:#4f8cff; --accent-dim:#2c4a82;
  --critical:#e5484d; --high:#f2994a; --medium:#f2c94c; --low:#6fcf97;
  --success:#3fb950; --danger:#e5484d; --warn:#f2994a;
  --radius:6px; --focus:2px solid #4f8cff;
  font-size:15px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
body{display:flex;flex-direction:column;min-height:100vh;}
a{color:var(--accent);}
button, select, input, textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px;}
button{cursor:pointer;}
button:hover{background:var(--accent-dim);}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
button.danger{background:var(--danger);color:#fff;border-color:var(--danger);}
button:disabled{opacity:.5;cursor:not-allowed;}
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible, [tabindex]:focus-visible{outline:var(--focus);outline-offset:2px;}
label{display:inline-flex;flex-direction:column;gap:2px;font-size:12px;color:var(--text-dim);}
table{border-collapse:collapse;width:100%;font-size:13px;}
th,td{border-bottom:1px solid var(--border);padding:6px 8px;text-align:left;}
th{color:var(--text-dim);font-weight:600;position:sticky;top:0;background:var(--surface);}
#topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg-alt);border-bottom:1px solid var(--border);}
#topbar h1{font-size:16px;margin:0;flex:0 0 auto;}
#session-badge{background:var(--warn);color:#1a1a1a;padding:2px 8px;border-radius:999px;font-size:12px;display:none;}
#session-badge.visible{display:inline-block;}
#topbar .spacer{flex:1;}
#app{display:flex;flex:1;min-height:0;}
#nav{width:190px;flex:0 0 auto;background:var(--bg-alt);border-right:1px solid var(--border);padding:10px 0;}
#nav a{display:block;padding:10px 16px;color:var(--text-dim);text-decoration:none;border-left:3px solid transparent;}
#nav a:hover{color:var(--text);background:var(--surface);}
#nav a.active{color:var(--text);border-left-color:var(--accent);background:var(--surface);}
#main{flex:1;overflow:auto;padding:18px 22px;min-width:0;}
.panel{display:none;}
.panel.active{display:block;}
.kpi-row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
.kpi-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;min-width:140px;}
.kpi-tile .val{font-size:24px;font-weight:700;}
.kpi-tile .lbl{font-size:12px;color:var(--text-dim);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
.card h2{margin-top:0;font-size:15px;}
.hint{color:var(--text-dim);font-size:12px;}
.banner{background:var(--surface-2);border:1px solid var(--warn);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;font-size:13px;}
.banner.error{border-color:var(--critical);}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;}
.sev-CRITICAL{background:var(--critical);color:#fff;}
.sev-HIGH{background:var(--high);color:#1a1a1a;}
.sev-MEDIUM{background:var(--medium);color:#1a1a1a;}
.sev-LOW{background:var(--low);color:#1a1a1a;}
.cell-under{background:#1e3a2c;}
.cell-target{background:#2a3a1e;}
.cell-over{background:#4a3a1e;}
.cell-critical{background:#4a1e1e;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto;z-index:100;}
.modal-overlay.hidden{display:none;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;max-width:720px;width:100%;}
.modal h2{margin-top:0;}
.modal .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.modal .row > *{flex:1;min-width:150px;}
#toast-region{position:fixed;bottom:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.4);}
.bar-track{background:var(--surface-2);border-radius:4px;height:8px;overflow:hidden;}
.bar-fill{height:100%;background:var(--accent);}
.candidate-card{border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px;background:var(--surface-2);}
.modifier-chip{display:inline-block;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:2px 8px;font-size:11px;margin-right:4px;}
.subgrid{display:grid;grid-template-columns:100px 1fr 40px;gap:6px;align-items:center;font-size:12px;margin:2px 0;}
.pagination{display:flex;gap:6px;align-items:center;margin-top:8px;}
fieldset{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;}
.empty-state{color:var(--text-dim);padding:40px;text-align:center;}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;}
</style>
</head>
<body>
<div id="topbar">
  <h1>ROE - Resource Optimization Engine</h1>
  <span id="session-badge" role="status">Session only - nothing is being saved</span>
  <div class="spacer"></div>
  <button id="btn-load-demo" type="button">Load demo data</button>
  <button id="btn-clear-all" type="button" class="danger">Clear all data</button>
</div>
<div id="app">
  <nav id="nav" aria-label="Panels">
    <a href="#overview" data-panel="overview">Overview</a>
    <a href="#skills" data-panel="skills">Skills Matrix</a>
    <a href="#projects" data-panel="projects">Projects</a>
    <a href="#optimizer" data-panel="optimizer">Optimizer</a>
    <a href="#mentorship" data-panel="mentorship">Mentorship</a>
    <a href="#timeline" data-panel="timeline">Timeline</a>
    <a href="#alerts" data-panel="alerts">Alerts</a>
    <a href="#settings" data-panel="settings">Data &amp; Settings</a>
  </nav>
  <main id="main">
    <div id="vendor-banner" class="banner hidden" style="display:none;"></div>
    <section id="panel-overview" class="panel"><div class="empty-state">Loading...</div></section>
    <section id="panel-skills" class="panel"></section>
    <section id="panel-projects" class="panel"></section>
    <section id="panel-optimizer" class="panel"></section>
    <section id="panel-mentorship" class="panel"></section>
    <section id="panel-timeline" class="panel"></section>
    <section id="panel-alerts" class="panel"></section>
    <section id="panel-settings" class="panel"></section>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast-region" aria-live="polite"></div>

<script>
window.ROE = window.ROE || {};

/* ===================== BLOCK 1: ROE.const ===================== */
/* Pure. No DOM. No I/O. Enums, adjacency table, defaults, schema version. */
ROE.const = (function(){
  // Bumped 1 -> 2 by BUILD_PLAN_ADDENDUM_1.md (customFieldDefs store). Migrated through the
  // migration ladder in ROE.db (see §2.6 / addendum §"Migration"); existing v1 installs are
  // untouched except gaining the new empty store.
  var SCHEMA_VERSION = 2;

  // BUILD_PLAN_ADDENDUM_1.md CF-1: the 6 entity types custom fields can be defined on.
  var CUSTOM_FIELD_ENTITY_TYPES = ["Employee","Project","Demand","Assignment","Mentorship","Skill"];
  var CUSTOM_FIELD_TYPES = ["text","number"];

  var DISCIPLINES = ["Civil","Architecture","MEP","Structural","Environmental","VDC","Data/Analytics","Landscape","Geotechnical"];

  // Symmetric adjacency table per BUILD_PLAN.md §3.
  var ADJACENCY = {
    "Civil":          ["Geotechnical","Environmental","Landscape","Structural"],
    "Architecture":   ["VDC","Structural","Landscape"],
    "MEP":            ["Structural","VDC"],
    "Structural":     ["Civil","Architecture","MEP","Geotechnical"],
    "Environmental":  ["Civil","Geotechnical","Data/Analytics"],
    "VDC":            ["Architecture","MEP","Data/Analytics"],
    "Data/Analytics": ["VDC","Environmental"],
    "Landscape":      ["Architecture","Civil"],
    "Geotechnical":   ["Civil","Structural","Environmental"]
  };

  var EMP_LEVELS = ["Junior","Mid-Level","Senior","Principal"];
  var EMP_LEVEL_ORD = { "Junior":1, "Mid-Level":2, "Senior":3, "Principal":4 };

  var LEVEL_LABELS = { 0:"None", 1:"Basic", 2:"Intermediate", 3:"Proficient", 4:"Advanced", 5:"Expert" };

  var BUSINESS_GROUPS = ["Transportation","Buildings","Water","Federal","Energy"];
  var PROJECT_PHASES = ["Planning","Concept","Schematic","DD","CD","CA","Final Design","Implementation"];
  var BIM_LEVELS = ["BIM Level 0","BIM Level 1","BIM Level 2","BIM Level 3"];
  var PROJECT_STATUS = ["Active","Pending","On Hold","Complete"];
  var MENTOR_ROLES = ["Mentor","Mentee","Peer","None"];
  var ASSIGNMENT_STATUS = ["Proposed","Committed"];
  var ASSIGNMENT_SOURCE = ["manual","optimizer","auto-staff","import","api"];
  var MENTORSHIP_FREQ = ["Weekly","Bi-Weekly","Monthly"];
  var MENTORSHIP_COMPAT = ["High","Medium","Low"];
  var MENTORSHIP_STATUS = ["Active","Pending","Ended"];

  var SEED_SKILLS = [
    { code:"REVIT",    name:"Revit",              category:"Design" },
    { code:"CIVIL3D",  name:"Civil 3D",           category:"Design" },
    { code:"AUTOCAD",  name:"AutoCAD",            category:"Design" },
    { code:"GIS",      name:"GIS",                category:"Analysis" },
    { code:"PYTHON",   name:"Python",             category:"Analysis" },
    { code:"NAVIS",    name:"Navisworks",         category:"Coordination" },
    { code:"BLUEBEAM", name:"Bluebeam",           category:"Documentation" },
    { code:"PM",       name:"Project Management", category:"Management" }
  ];

  var DEFAULT_SETTINGS = {
    schemaVersion: SCHEMA_VERSION,
    horizonStart: "2026-01",
    horizonMonths: 12,
    weights: { skill:0.35, availability:0.30, seniority:0.15, discipline:0.20 },
    presets: [],
    ctxTaxPerExtraProject: 7,
    ctxTaxCapPct: 30,
    ctxCap: 4,
    alertThresholds: { overallocPct:100, sustainedMonths:2, targetSlackPct:10, benchGapPct:25, benchMonths:3 },
    requireMinSkillLevels: false,
    sessionOnly: false,
    theme: "dark",
    api: { baseUrl:"", authMode:"none", authHeaderName:"X-API-Key", timeoutMs:15000,
      entities:{
        employees:  { enabled:false, pullPath:"/employees", responseRoot:"", pushPath:"/employees", pushMethod:"POST", pushMode:"bulk", idField:"id" },
        projects:   { enabled:false, pullPath:"/projects",  responseRoot:"", pushPath:"/projects",  pushMethod:"POST", pushMode:"bulk", idField:"id" },
        demands:    { enabled:false, pullPath:"/demands",   responseRoot:"", pushPath:"/demands",   pushMethod:"POST", pushMode:"bulk", idField:"id" },
        assignments:{ enabled:false, pullPath:"/assignments",responseRoot:"", pushPath:"/assignments",pushMethod:"POST", pushMode:"bulk", idField:"id" },
        skills:     { enabled:false, pullPath:"/skills",    responseRoot:"", pushPath:"/skills",    pushMethod:"POST", pushMode:"bulk", idField:"id" }
      },
      fieldMappings: {}
    }
  };

  // Optimizer sub-score lookup tables (§4.3)
  var SKILL_GAP_TABLE = function(gap){
    if (gap >= 2) return Math.max(85, 100 - 5*(gap-1));
    if (gap === 1) return 100;
    if (gap === 0) return 100;
    if (gap === -1) return 60;
    if (gap === -2) return 30;
    return 0; // gap <= -3
  };
  var SENIORITY_TABLE = function(d){
    if (d === 0) return 100;
    if (d === 1) return 85;
    if (d >= 2) return 65;
    if (d === -1) return 50;
    return 15; // d <= -2
  };
  var MENTOR_SENIORITY_DELTA_TABLE = function(delta){
    if (delta === 1) return 70;
    if (delta === 2) return 100;
    if (delta === 3) return 80;
    return 0; // 0 or negative
  };

  return {
    SCHEMA_VERSION: SCHEMA_VERSION,
    CUSTOM_FIELD_ENTITY_TYPES: CUSTOM_FIELD_ENTITY_TYPES,
    CUSTOM_FIELD_TYPES: CUSTOM_FIELD_TYPES,
    DISCIPLINES: DISCIPLINES,
    ADJACENCY: ADJACENCY,
    EMP_LEVELS: EMP_LEVELS,
    EMP_LEVEL_ORD: EMP_LEVEL_ORD,
    LEVEL_LABELS: LEVEL_LABELS,
    BUSINESS_GROUPS: BUSINESS_GROUPS,
    PROJECT_PHASES: PROJECT_PHASES,
    BIM_LEVELS: BIM_LEVELS,
    PROJECT_STATUS: PROJECT_STATUS,
    MENTOR_ROLES: MENTOR_ROLES,
    ASSIGNMENT_STATUS: ASSIGNMENT_STATUS,
    ASSIGNMENT_SOURCE: ASSIGNMENT_SOURCE,
    MENTORSHIP_FREQ: MENTORSHIP_FREQ,
    MENTORSHIP_COMPAT: MENTORSHIP_COMPAT,
    MENTORSHIP_STATUS: MENTORSHIP_STATUS,
    SEED_SKILLS: SEED_SKILLS,
    DEFAULT_SETTINGS: DEFAULT_SETTINGS,
    SKILL_GAP_TABLE: SKILL_GAP_TABLE,
    SENIORITY_TABLE: SENIORITY_TABLE,
    MENTOR_SENIORITY_DELTA_TABLE: MENTOR_SENIORITY_DELTA_TABLE
  };
})();

/* ===================== BLOCK 2: ROE.util ===================== */
/* Pure helpers: month keys, clamp, deep equal, id gen, CSV escape, fuzzy header match. */
ROE.util = (function(){
  function clamp(v, min, max){
    if (v < min) return min;
    if (v > max) return max;
    return v;
  }

  function round(v){ return Math.round(v); }

  function sum(arr){
    var s = 0;
    for (var i=0;i<arr.length;i++) s += arr[i];
    return s;
  }

  function mean(arr){
    if (!arr || arr.length === 0) return 0;
    return sum(arr) / arr.length;
  }

  // "2026-01" -> {y:2026, m:1}
  function parseMonthKey(key){
    var parts = String(key).split("-");
    return { y: parseInt(parts[0],10), m: parseInt(parts[1],10) };
  }

  function monthKeyOf(y, m){
    while (m > 12){ m -= 12; y += 1; }
    while (m < 1){ m += 12; y -= 1; }
    var mm = (m < 10 ? "0"+m : ""+m);
    return y + "-" + mm;
  }

  function addMonths(key, n){
    var p = parseMonthKey(key);
    return monthKeyOf(p.y, p.m + n);
  }

  // Contiguous list of month keys, length n, starting at start ("YYYY-MM").
  function monthKeys(start, n){
    var out = [];
    for (var i=0;i<n;i++) out.push(addMonths(start, i));
    return out;
  }

  function monthDiff(a, b){
    var pa = parseMonthKey(a), pb = parseMonthKey(b);
    return (pb.y - pa.y) * 12 + (pb.m - pa.m);
  }

  // Deterministic id generator. Not cryptographic; fine for a single-user client-side tool.
  var _idCounter = 0;
  function genId(prefix){
    _idCounter += 1;
    var rand = Math.random().toString(36).slice(2, 8);
    return (prefix || "id") + "_" + Date.now().toString(36) + "_" + _idCounter.toString(36) + rand;
  }

  function deepEqual(a, b){
    if (a === b) return true;
    if (typeof a !== typeof b) return false;
    if (a === null || b === null) return a === b;
    if (typeof a !== "object") return a === b;
    if (Array.isArray(a) !== Array.isArray(b)) return false;
    if (Array.isArray(a)){
      if (a.length !== b.length) return false;
      for (var i=0;i<a.length;i++) if (!deepEqual(a[i], b[i])) return false;
      return true;
    }
    var ka = Object.keys(a).sort();
    var kb = Object.keys(b).sort();
    if (ka.length !== kb.length) return false;
    for (var j=0;j<ka.length;j++){
      if (ka[j] !== kb[j]) return false;
      if (!deepEqual(a[ka[j]], b[kb[j]])) return false;
    }
    return true;
  }

  function csvEscape(val){
    if (val === null || val === undefined) return "";
    var s = String(val);
    if (/[",\n\r]/.test(s)){
      s = '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  }

  function csvRow(cells){
    return cells.map(csvEscape).join(",");
  }

  // Normalize a header for fuzzy matching: lowercase, strip non-alphanumerics.
  function normalizeHeader(h){
    return String(h || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  }

  // Returns the best matching header from `candidates` for canonical field `field`, or null.
  function fuzzyMatchHeader(field, candidates){
    var target = normalizeHeader(field);
    var best = null, bestScore = 0;
    for (var i=0;i<candidates.length;i++){
      var c = candidates[i];
      var norm = normalizeHeader(c);
      var score = 0;
      if (norm === target) score = 100;
      else if (norm.indexOf(target) !== -1 || target.indexOf(norm) !== -1) score = 60;
      if (score > bestScore){ bestScore = score; best = c; }
    }
    return bestScore > 0 ? best : null;
  }

  function isMonthKey(s){
    return /^\d{4}-(0[1-9]|1[0-2])$/.test(String(s));
  }

  function parseNum(v, fallback){
    var n = typeof v === "number" ? v : parseFloat(v);
    return isNaN(n) ? (fallback === undefined ? 0 : fallback) : n;
  }

  function clone(obj){
    return JSON.parse(JSON.stringify(obj));
  }

  function nowIso(){
    return new Date().toISOString();
  }

  return {
    clamp: clamp, round: round, sum: sum, mean: mean,
    monthKeys: monthKeys, addMonths: addMonths, monthDiff: monthDiff, parseMonthKey: parseMonthKey, monthKeyOf: monthKeyOf, isMonthKey: isMonthKey,
    genId: genId, deepEqual: deepEqual, clone: clone,
    csvEscape: csvEscape, csvRow: csvRow,
    normalizeHeader: normalizeHeader, fuzzyMatchHeader: fuzzyMatchHeader,
    parseNum: parseNum, nowIso: nowIso
  };
})();

/* ===================== BLOCK 3: ROE.model ===================== */
/* Pure. Canonical record factories + validators. */
ROE.model = (function(){
  var C = ROE.const, U = ROE.util;

  function ok(errors){ return { ok: errors.length === 0, errors: errors }; }

  function req(errors, rec, field, label){
    var v = rec[field];
    if (v === undefined || v === null || v === ""){
      errors.push({ field: field, message: (label||field) + " is required" });
    }
  }

  function oneOf(errors, rec, field, allowed, label){
    if (rec[field] !== undefined && rec[field] !== null && rec[field] !== "" && allowed.indexOf(rec[field]) === -1){
      errors.push({ field: field, message: (label||field) + " must be one of: " + allowed.join(", ") });
    }
  }

  // ---- Custom fields (BUILD_PLAN_ADDENDUM_1.md CF-1..CF-4) ----
  // record.custom is always optional/absent-is-valid (CF-4). Only fields with a matching def of
  // type "number" are validated (must parse as a number if present); unknown keys - e.g. left over
  // from a field def that was since removed elsewhere - are always permitted, never invalidate a
  // record. This function is called from every validate<Entity> below.
  function validateCustomFields(errors, rec, fieldDefs, entityType){
    if (rec.custom === undefined || rec.custom === null) return;
    if (typeof rec.custom !== "object" || Array.isArray(rec.custom)){
      errors.push({ field:"custom", message:"Custom fields must be an object" });
      return;
    }
    var numberDefs = (fieldDefs || []).filter(function(d){ return d.entityType === entityType && d.type === "number"; });
    numberDefs.forEach(function(def){
      var v = rec.custom[def.key];
      if (v === undefined || v === null || v === "") return; // absent is valid, never required
      var n = typeof v === "number" ? v : parseFloat(v);
      if (isNaN(n)) errors.push({ field: "custom."+def.key, message: "'" + (def.label||def.key) + "' must be a number" });
    });
  }

  // Attaches `custom` to a record factory's output ONLY if it has at least one key - unset custom
  // fields must never be stored as a stray `custom: {}` (CF-3 acceptance criterion).
  function withCustom(rec, custom){
    if (custom && typeof custom === "object" && Object.keys(custom).length > 0) rec.custom = custom;
    return rec;
  }

  var CUSTOM_FIELD_ENTITY_TYPES = C.CUSTOM_FIELD_ENTITY_TYPES;
  var CUSTOM_FIELD_TYPES = C.CUSTOM_FIELD_TYPES;

  // Generates a stable, URL-safe key from a label (lowercase, non-alphanumerics -> "_", trimmed).
  // Per CF-1, the key is fixed at creation time; renaming the label later never changes it.
  function keyFromLabel(label){
    var k = String(label||"").trim().toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"");
    return k || "field";
  }

  function newCustomFieldDef(p){
    p = p || {};
    return {
      id: p.id || U.genId("cfd"),
      entityType: p.entityType || CUSTOM_FIELD_ENTITY_TYPES[0],
      key: p.key || keyFromLabel(p.label),
      label: p.label || "",
      type: p.type || "text",
      createdAt: p.createdAt || U.nowIso()
    };
  }

  function validateCustomFieldDef(rec, existingDefs){
    var errors = [];
    req(errors, rec, "id", "Field ID");
    req(errors, rec, "key", "Key");
    req(errors, rec, "label", "Label");
    oneOf(errors, rec, "entityType", CUSTOM_FIELD_ENTITY_TYPES, "Entity type");
    oneOf(errors, rec, "type", CUSTOM_FIELD_TYPES, "Type");
    if (existingDefs){
      var dup = existingDefs.some(function(d){ return d.entityType === rec.entityType && d.key === rec.key && d.id !== rec.id; });
      if (dup) errors.push({ field:"key", message:"A field with this key already exists for " + rec.entityType });
    }
    return ok(errors);
  }

  function listFieldDefs(defs, entityType){
    return (defs || []).filter(function(d){ return d.entityType === entityType; });
  }

  // Adds a new field def for `entityType`, auto-suffixing the generated key (_2, _3, ...) if the
  // label collides with an existing def's key for the same entity type. Pure: returns a new array.
  function addFieldDef(defs, entityType, label, type){
    defs = defs || [];

  // ---- Project ----
  function newProject(p){

  // ---- Mentorship ----
