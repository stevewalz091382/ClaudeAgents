/* ===================== BLOCK 4: ROE.calc ===================== */
/* Pure. Index builders, ctxTax, capacity, utilization, demand fill. Memoized by the caller (ROE.store) on a dirty flag. */
ROE.calc = (function(){
  var U = ROE.util;

  function ctxTaxPct(n, settings){
    var rate = settings.ctxTaxPerExtraProject;
    var cap = settings.ctxTaxCapPct;
    if (n <= 1) return 0;
    return U.clamp(rate * (n - 1), 0, cap);
  }

  // Builds memoizable lookup structures from the full canonical state.
  // Returns { byEmployeeMonth: Map<empId, Map<monthKey,{pct,projectIds:Set}>>,
  //           byProjectMonth:  Map<projectId, Map<monthKey,{pct,employeeIds:Set}>>,
  //           demandFill:      Map<demandId, Map<monthKey, fillPct>> }
  function buildIndexes(state){
    var byEmployeeMonth = new Map();
    var byProjectMonth = new Map();
    var demandAssigned = new Map(); // demandId -> monthKey -> pct sum

    (state.assignments || []).forEach(function(a){
      var alloc = a.allocationByMonth || {};
      for (var m in alloc){
        var pct = alloc[m];
        if (!pct) continue;

        if (!byEmployeeMonth.has(a.employeeId)) byEmployeeMonth.set(a.employeeId, new Map());
        var empMonths = byEmployeeMonth.get(a.employeeId);
        if (!empMonths.has(m)) empMonths.set(m, { pct:0, projectIds:new Set() });
        var eRec = empMonths.get(m);
        eRec.pct += pct;
        eRec.projectIds.add(a.projectId);

        if (!byProjectMonth.has(a.projectId)) byProjectMonth.set(a.projectId, new Map());
        var prjMonths = byProjectMonth.get(a.projectId);
        if (!prjMonths.has(m)) prjMonths.set(m, { pct:0, employeeIds:new Set() });
        var pRec = prjMonths.get(m);
        pRec.pct += pct;
        pRec.employeeIds.add(a.employeeId);

        if (a.demandId){
          if (!demandAssigned.has(a.demandId)) demandAssigned.set(a.demandId, new Map());
          var dm = demandAssigned.get(a.demandId);
          dm.set(m, (dm.get(m) || 0) + pct);
        }
      }
    });

    var demandFill = new Map();
    (state.demands || []).forEach(function(d){
      var fillByMonth = new Map();
      var assignedByMonth = demandAssigned.get(d.id) || new Map();
      for (var m in (d.allocationByMonth || {})){
        var perOpening = d.allocationByMonth[m] || 0;
        var required = perOpening * (d.openings || 1);
        var assigned = assignedByMonth.get(m) || 0;
        var pct = required > 0 ? (100 * assigned / required) : 100;
        fillByMonth.set(m, pct);
      }
      demandFill.set(d.id, fillByMonth);
    });

    return { byEmployeeMonth: byEmployeeMonth, byProjectMonth: byProjectMonth, demandFill: demandFill };
  }

  function n(empId, month, idx){
    var em = idx.byEmployeeMonth.get(empId);
    if (!em) return 0;
    var rec = em.get(month);
    return rec ? rec.projectIds.size : 0;
  }

  // Projected concurrent-project count for a *candidate* evaluation: existing distinct
  // projects that month, plus 1 if `projectId` is not already among them.
  function projectedN(empId, month, projectId, idx){
    var em = idx.byEmployeeMonth.get(empId);
    if (!em) return 1;
    var rec = em.get(month);
    if (!rec) return 1;
    return rec.projectIds.has(projectId) ? rec.projectIds.size : rec.projectIds.size + 1;
  }

  function effectiveCapacity(emp, month, idx, settings){
    var count = n(emp.id, month, idx);
    var tax = ctxTaxPct(count, settings);
    return emp.targetUtil * (1 - tax/100);
  }

  // Effective capacity using a projected concurrent-project count (for candidate evaluation).
  function effectiveCapacityProjected(emp, month, projectId, idx, settings){
    var count = projectedN(emp.id, month, projectId, idx);
    var tax = ctxTaxPct(count, settings);
    return emp.targetUtil * (1 - tax/100);
  }

  function committed(empId, month, idx){
    var em = idx.byEmployeeMonth.get(empId);
    if (!em) return 0;
    var rec = em.get(month);
    return rec ? rec.pct : 0;
  }

  function netCap(emp, month, idx, settings){
    return effectiveCapacity(emp, month, idx, settings) - committed(emp.id, month, idx);
  }

  function free(emp, month, idx, settings){
    return Math.max(0, netCap(emp, month, idx, settings));
  }

  // free() using the projected concurrent-project count (for candidate evaluation).
  function freeProjected(emp, month, projectId, idx, settings){
    var cap = effectiveCapacityProjected(emp, month, projectId, idx, settings);
    var used = committed(emp.id, month, idx);
    return Math.max(0, cap - used);
  }

  function utilization(empId, month, idx){
    return committed(empId, month, idx);
  }

  function demandFillPct(demandId, month, idx){
    var dm = idx.demandFill.get(demandId);
    if (!dm) return 100;
    var v = dm.get(month);
    return v === undefined ? 100 : v;
  }

  function concurrentProjectsAt(empId, month, idx){
    return n(empId, month, idx);
  }

  return {
    ctxTaxPct: ctxTaxPct,
    buildIndexes: buildIndexes,
    n: n, projectedN: projectedN,
    effectiveCapacity: effectiveCapacity, effectiveCapacityProjected: effectiveCapacityProjected,
    committed: committed, netCap: netCap, free: free, freeProjected: freeProjected,
    utilization: utilization, demandFillPct: demandFillPct, concurrentProjectsAt: concurrentProjectsAt
  };
})();

/* ===================== BLOCK 5: ROE.score ===================== */
/* Pure. Optimizer sub-scores, composite, modifiers, candidate ranking, auto-staff solver. */
ROE.score = (function(){
  var C = ROE.const, U = ROE.util, CALC = ROE.calc;

  function normalizeWeights(w){
    w = w || {};
    var skill = U.parseNum(w.skill, 0), availability = U.parseNum(w.availability, 0),
        seniority = U.parseNum(w.seniority, 0), discipline = U.parseNum(w.discipline, 0);
    var total = skill + availability + seniority + discipline;
    if (total <= 0) return U.clone(C.DEFAULT_SETTINGS.weights);
    return { skill: skill/total, availability: availability/total, seniority: seniority/total, discipline: discipline/total };
  }

  function disciplineRelation(a, b){
    if (a === b) return "exact";
    var adj = C.ADJACENCY[a] || [];
    if (adj.indexOf(b) !== -1) return "adjacent";
    return "unrelated";
  }

  function disciplineSubScore(a, b){
    var rel = disciplineRelation(a, b);
    if (rel === "exact") return 100;
    if (rel === "adjacent") return 65;
    return 25;
  }

  function empSkillMap(state, empId){
    var map = {};
    (state.employeeSkills || []).forEach(function(es){
      if (es.employeeId === empId) map[es.skillId] = es.level;
    });
    return map;
  }

  function skillScoreFor(requiredSkills, empSkills){
    if (!requiredSkills || requiredSkills.length === 0){
      return { score: 70, disqualified: false, breakdown: [] };
    }
    var wsum = 0, num = 0, disqualified = false, breakdown = [];
    requiredSkills.forEach(function(rs){
      var e = empSkills[rs.skillId] !== undefined ? empSkills[rs.skillId] : 0;
      var gap = e - rs.minLevel;
      var sub = C.SKILL_GAP_TABLE(gap);
      var weight = rs.weight || 1;
      wsum += weight;
      num += sub * weight;
      if (gap < 0) disqualified = true;
      breakdown.push({ skillId: rs.skillId, empLevel: e, minLevel: rs.minLevel, gap: gap, sub: sub, weight: weight });
    });
    var score = wsum > 0 ? num / wsum : 70;
    return { score: score, disqualified: disqualified, breakdown: breakdown };
  }

  function demandMonths(demand){
    var months = [];
    for (var m in (demand.allocationByMonth || {})){
      if (demand.allocationByMonth[m] > 0) months.push(m);
    }
    return months;
  }

  function availabilityScoreFor(emp, demand, projectId, idx, settings){
    var months = demandMonths(demand);
    if (months.length === 0) return { score: 100, feasibleFraction: 1, perMonth: [] };
    var fits = [];
    var perMonth = [];
    months.forEach(function(m){
      var freeAmt = CALC.freeProjected(emp, m, projectId, idx, settings);
      var need = demand.allocationByMonth[m];
      var fit = need > 0 ? Math.min(1, freeAmt / need) : 1;
      fits.push(fit);
      perMonth.push({ month:m, free:freeAmt, need:need, fit:fit });
    });
    var feasibleFraction = U.mean(fits);
    return { score: 100 * feasibleFraction, feasibleFraction: feasibleFraction, perMonth: perMonth };
  }

  function seniorityScoreFor(empLevel, demandMinLevel){
    var empOrd = C.EMP_LEVEL_ORD[empLevel] || 1;
    var demOrd = C.EMP_LEVEL_ORD[demandMinLevel] || 1;
    var d = empOrd - demOrd;
    return { score: C.SENIORITY_TABLE(d), delta: d };
  }

  function isActiveMentorOf(state, empId, projectId, idx){
    // true if this employee is a Mentor (with <2 active mentees) and one of their mentees is staffed on projectId
    var mentorships = (state.mentorships || []).filter(function(m){ return m.mentorId === empId && m.status === "Active"; });
    if (mentorships.length >= 2) return false;
    var prjMonths = idx.byProjectMonth.get(projectId);
    if (!prjMonths) return false;
    var staffedIds = new Set();
    prjMonths.forEach(function(rec){ rec.employeeIds.forEach(function(id){ staffedIds.add(id); }); });
    return mentorships.some(function(m){ return staffedIds.has(m.menteeId); });
  }

  function isMenteeOfStaffedMentor(state, empId, projectId, idx){
    var mentorships = (state.mentorships || []).filter(function(m){ return m.menteeId === empId && m.status === "Active"; });
    if (mentorships.length === 0) return false;
    var prjMonths = idx.byProjectMonth.get(projectId);
    if (!prjMonths) return false;
    var staffedIds = new Set();
    prjMonths.forEach(function(rec){ rec.employeeIds.forEach(function(id){ staffedIds.add(id); }); });
    return mentorships.some(function(m){ return staffedIds.has(m.mentorId); });
  }

  function hasCommittedOnProject(state, empId, projectId){
    return (state.assignments || []).some(function(a){
      return a.employeeId === empId && a.projectId === projectId && a.status === "Committed";
    });
  }

  // Core scoring function. Returns full breakdown per §4.3-4.4.
  function scoreCandidate(state, empId, demandId, weights){
    var settings = state.settings;
    var idx = state._idx || CALC.buildIndexes(state);
    var emp = (state.employees || []).find(function(e){ return e.id === empId; });
    var demand = (state.demands || []).find(function(d){ return d.id === demandId; });
    if (!emp || !demand) return null;
    var project = (state.projects || []).find(function(p){ return p.id === demand.projectId; });

    var w = normalizeWeights(weights);
    var empSkills = empSkillMap(state, empId);
    var skillR = skillScoreFor(demand.requiredSkills, empSkills);
    var availR = availabilityScoreFor(emp, demand, demand.projectId, idx, settings);
    var seniorR = seniorityScoreFor(emp.level, demand.minLevel);
    var discScore = disciplineSubScore(emp.discipline, demand.discipline);

    var disqualified = settings.requireMinSkillLevels && skillR.disqualified;

    var subScores = { skill: skillR.score, availability: availR.score, seniority: seniorR.score, discipline: discScore };
    var contributions = {
      skill: w.skill * subScores.skill,
      availability: w.availability * subScores.availability,
      seniority: w.seniority * subScores.seniority,
      discipline: w.discipline * subScores.discipline
    };
    var base = contributions.skill + contributions.availability + contributions.seniority + contributions.discipline;

    var modifiers = [];
    if (hasCommittedOnProject(state, empId, demand.projectId)){
      modifiers.push({ name:"Continuity", value:4, reason:"Employee already has a committed assignment on this project" });
    }
    if (isActiveMentorOf(state, empId, demand.projectId, idx)){
      modifiers.push({ name:"Mentorship", value:5, reason:"Candidate is a mentor of a mentee already staffed on this project" });
    } else if (isMenteeOfStaffedMentor(state, empId, demand.projectId, idx)){
      modifiers.push({ name:"Mentorship", value:5, reason:"Candidate's mentor is already staffed on this project" });
    }
    var months = demandMonths(demand);
    var overload = months.some(function(m){
      return CALC.projectedN(empId, m, demand.projectId, idx) > settings.ctxCap;
    });
    if (overload){
      modifiers.push({ name:"Overload", value:-10, reason:"Would push concurrent projects above ctxCap ("+settings.ctxCap+") in at least one demand month" });
    }
    var committedVals = months.map(function(m){ return CALC.committed(empId, m, idx); });
    var meanCommitted = U.mean(committedVals);
    var benchThreshold = emp.targetUtil - (settings.alertThresholds.benchGapPct || 0);
    if (months.length > 0 && meanCommitted < benchThreshold){
      modifiers.push({ name:"Bench relief", value:3, reason:"Mean committed ("+Math.round(meanCommitted)+"%) is below target minus bench gap ("+benchThreshold+"%)" });
    }

    var modifierSum = modifiers.reduce(function(s,m){ return s + m.value; }, 0);
    var clampedModifiers = U.clamp(modifierSum, -15, 10);

    var matchScore = U.clamp(Math.round(base + clampedModifiers), 0, 100);

    var reasons = [];
    if (disqualified) reasons.push("below minimum skill level");

    return {
      employeeId: empId, demandId: demandId,
      matchScore: matchScore,
      subScores: subScores,
      contributions: contributions,
      base: base,
      modifiers: modifiers,
      modifierSum: modifierSum,
      clampedModifiers: clampedModifiers,
      feasibleFraction: availR.feasibleFraction,
      skillBreakdown: skillR.breakdown,
      availabilityBreakdown: availR.perMonth,
      seniorityDelta: seniorR.delta,
      disqualified: disqualified,
      reasons: reasons
    };
  }

  // Ranks all active employees against a demand. Excludes disqualified candidates when
  // settings.requireMinSkillLevels is true (they are returned separately as `excluded`).
  function rankCandidates(state, demandId, weights){
    var idx = state._idx || CALC.buildIndexes(state);
    var stateWithIdx = state._idx ? state : Object.assign({}, state, { _idx: idx });
    var results = [], excluded = [];
    (state.employees || []).filter(function(e){ return e.active; }).forEach(function(emp){
      var r = scoreCandidate(stateWithIdx, emp.id, demandId, weights);
      if (!r) return;
      if (r.disqualified){ excluded.push(r); return; }
      results.push(r);
    });
    results.sort(function(a, b){
      if (b.matchScore !== a.matchScore) return b.matchScore - a.matchScore;
      if (b.feasibleFraction !== a.feasibleFraction) return b.feasibleFraction - a.feasibleFraction;
      return a.employeeId < b.employeeId ? -1 : (a.employeeId > b.employeeId ? 1 : 0);
    });
    return { candidates: results, excluded: excluded };
  }

  // ---- Auto-staff solver (§4.5): greedy, deterministic, explainable. ----
  // Returns { proposals:[{demandId, employeeId, allocationByMonth, scoreSnapshot}], unfilled:[{demandId, reason}] }
  function autoStaff(state, projectId, weights){
    var workingState = U.clone(state);
    workingState.assignments = (state.assignments || []).slice(); // shallow ok, we only append
    var demands = (state.demands || []).filter(function(d){ return d.projectId === projectId; });
    var project = (state.projects || []).find(function(p){ return p.id === projectId; });

    function totalFte(d){
      var s = 0;
      for (var m in d.allocationByMonth) s += d.allocationByMonth[m] * (d.openings || 1);
      return s;
    }

    demands = demands.slice().sort(function(a, b){
      if (project.priority !== undefined && a.projectId === b.projectId){ /* same project, same priority */ }
      var fa = totalFte(a), fb = totalFte(b);
      if (fb !== fa) return fb - fa;
      return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
    });
    // Overall ordering across demands: project.priority asc (all demands share one project here), then FTE desc, then id asc.
    // autoStaff operates per-project so priority is constant; ordering above covers FTE desc / id asc.

    var proposals = [];
    var unfilled = [];

    demands.forEach(function(demand){
      for (var opening = 0; opening < demand.openings; opening++){
        workingState._idx = ROE.calc.buildIndexes(workingState);
        var ranking = rankCandidates(workingState, demand.id, weights);
        var eligible = ranking.candidates.filter(function(c){ return c.feasibleFraction > 0; });
        if (eligible.length === 0){
          var reason = "no capacity / no skill match / all candidates below minimum";
          if (ranking.candidates.length === 0 && ranking.excluded.length > 0) reason = "all candidates below minimum skill level";
          else if (ranking.candidates.every(function(c){ return c.feasibleFraction === 0; })) reason = "no capacity";
          unfilled.push({ demandId: demand.id, opening: opening+1, reason: reason });
          continue;
        }
        var pick = eligible[0];
        var emp = workingState.employees.find(function(e){ return e.id === pick.employeeId; });
        var alloc = {};
        for (var m in demand.allocationByMonth){
          var need = demand.allocationByMonth[m];
          if (!need) continue;
          var freeAmt = ROE.calc.freeProjected(emp, m, projectId, workingState._idx, workingState.settings);
          var give = Math.min(need, freeAmt);
          if (give > 0) alloc[m] = give;
        }
        var proposal = {
          id: ROE.util.genId("asg"),
          demandId: demand.id,
          projectId: projectId,
          employeeId: emp.id,
          allocationByMonth: alloc,
          status: "Proposed",
          source: "auto-staff",
          scoreSnapshot: pick.matchScore,
          updatedAt: ROE.util.nowIso()
        };
        proposals.push(proposal);
        // Recompute indexes for later picks: append this proposal to the working assignment list.
        workingState.assignments = workingState.assignments.concat([proposal]);
      }
    });

    return { proposals: proposals, unfilled: unfilled };
  }

  return {
    normalizeWeights: normalizeWeights,
    disciplineRelation: disciplineRelation,
    disciplineSubScore: disciplineSubScore,
    skillScoreFor: skillScoreFor,
    availabilityScoreFor: availabilityScoreFor,
    seniorityScoreFor: seniorityScoreFor,
    scoreCandidate: scoreCandidate,
    rankCandidates: rankCandidates,
    autoStaff: autoStaff
  };
})();

/* ===================== BLOCK 6: ROE.alerts ===================== */
/* Pure. Rules engine. Alerts are always derived, never persisted. */
ROE.alerts = (function(){
  var U = ROE.util, CALC = ROE.calc;

  function consecutiveRuns(monthList, predicate){
    var runs = [], cur = [];
    monthList.forEach(function(m){
      if (predicate(m)){ cur.push(m); }
      else { if (cur.length) runs.push(cur); cur = []; }
    });
    if (cur.length) runs.push(cur);
    return runs;
  }

  function severityForBurnout(score){
    if (score >= 70) return "CRITICAL";
    if (score >= 50) return "HIGH";
    if (score >= 30) return "MEDIUM";
    return null;
  }

  function scan(state, thresholds){
    var settings = state.settings;
    thresholds = thresholds || settings.alertThresholds;
    var idx = state._idx || CALC.buildIndexes(state);
    var months = U.monthKeys(settings.horizonStart, settings.horizonMonths);
    var alerts = [];
    var seq = 0;
    function push(a){
      seq += 1;
      alerts.push(Object.assign({ id: "alrt_" + seq }, a));
    }

    var activeEmployees = (state.employees || []).filter(function(e){ return e.active; });

    activeEmployees.forEach(function(emp){
      var committedByMonth = months.map(function(m){ return CALC.committed(emp.id, m, idx); });
      var concurrentByMonth = months.map(function(m){ return CALC.concurrentProjectsAt(emp.id, m, idx); });

      // SUSTAINED_OVERALLOC
      var overallocRuns = consecutiveRuns(months, function(m){ return CALC.committed(emp.id, m, idx) > thresholds.overallocPct; });
      var sustainedRuns = overallocRuns.filter(function(r){ return r.length >= thresholds.sustainedMonths; });
      sustainedRuns.forEach(function(run){
        push({ severity:"HIGH", ruleId:"SUSTAINED_OVERALLOC", subjectType:"employee", subjectId:emp.id,
          monthKeys: run, message: emp.name + " is over " + thresholds.overallocPct + "% committed for " + run.length + " consecutive month(s)",
          suggestedAction: "Rebalance or reduce allocations for " + emp.name });
      });

      // OVER_TARGET (>= 3 consecutive months over targetUtil + targetSlackPct)
      var overTargetThreshold = emp.targetUtil + thresholds.targetSlackPct;
      var overTargetRuns = consecutiveRuns(months, function(m){ return CALC.committed(emp.id, m, idx) > overTargetThreshold; });
      overTargetRuns.filter(function(r){ return r.length >= 3; }).forEach(function(run){
        push({ severity:"MEDIUM", ruleId:"OVER_TARGET", subjectType:"employee", subjectId:emp.id,
          monthKeys: run, message: emp.name + " is over target+slack (" + overTargetThreshold + "%) for " + run.length + " month(s)",
          suggestedAction: "Review workload against target utilization" });
      });

      // CTX_OVERLOAD
      var overloadMonths = months.filter(function(m){ return CALC.concurrentProjectsAt(emp.id, m, idx) > settings.ctxCap; });
      if (overloadMonths.length){
        var maxConcurrent = Math.max.apply(null, overloadMonths.map(function(m){ return CALC.concurrentProjectsAt(emp.id, m, idx); }));
        var sev = maxConcurrent > settings.ctxCap + 2 ? "HIGH" : "MEDIUM";
        push({ severity: sev, ruleId:"CTX_OVERLOAD", subjectType:"employee", subjectId:emp.id,
          monthKeys: overloadMonths, message: emp.name + " exceeds ctxCap (" + settings.ctxCap + ") with up to " + maxConcurrent + " concurrent projects",
          suggestedAction: "Reduce concurrent project count for " + emp.name });
      }

      // BENCH_RISK
      var benchThreshold = emp.targetUtil - thresholds.benchGapPct;
      var benchRuns = consecutiveRuns(months, function(m){ return CALC.committed(emp.id, m, idx) < benchThreshold; });
      benchRuns.filter(function(r){ return r.length >= thresholds.benchMonths; }).forEach(function(run){
        push({ severity:"LOW", ruleId:"BENCH_RISK", subjectType:"employee", subjectId:emp.id,
          monthKeys: run, message: emp.name + " is under " + benchThreshold + "% committed for " + run.length + " month(s)",
          suggestedAction: "Consider staffing " + emp.name + " on additional work" });
      });

      // BURNOUT_COMPOSITE
      var sustainedOverallocMonths = months.filter(function(m){ return CALC.committed(emp.id, m, idx) > thresholds.overallocPct; }).length;
      var peakCommitted = committedByMonth.length ? Math.max.apply(null, committedByMonth) : 0;
      var maxConcurrentProjects = concurrentByMonth.length ? Math.max.apply(null, concurrentByMonth) : 0;
      var burnoutScore = 100 * (
        0.5 * (sustainedOverallocMonths / settings.horizonMonths) +
        0.3 * Math.min(1, Math.max(0, (peakCommitted - 100)) / 50) +
        0.2 * Math.min(1, maxConcurrentProjects / 6)
      );
      var bSev = severityForBurnout(burnoutScore);
      if (bSev){
        push({ severity:bSev, ruleId:"BURNOUT_COMPOSITE", subjectType:"employee", subjectId:emp.id,
          monthKeys: months.filter(function(m){ return CALC.committed(emp.id, m, idx) > thresholds.overallocPct; }),
          message: emp.name + " burnout composite score is " + Math.round(burnoutScore),
          suggestedAction: "Review " + emp.name + "'s overall load and concurrent project count",
          score: burnoutScore });
      }
    });

    // UNSTAFFED_DEMAND / SKILL_GAP (per demand)
    (state.demands || []).forEach(function(demand){
      var project = (state.projects || []).find(function(p){ return p.id === demand.projectId; });
      var priority = project ? project.priority : 3;
      var months2 = Object.keys(demand.allocationByMonth || {});
      var understaffedMonths = months2.filter(function(m){ return CALC.demandFillPct(demand.id, m, idx) < 100; });
      if (understaffedMonths.length){
        push({ severity: priority <= 2 ? "HIGH" : "MEDIUM", ruleId:"UNSTAFFED_DEMAND", subjectType:"demand", subjectId:demand.id,
          monthKeys: understaffedMonths, message: "Demand '" + demand.title + "' is understaffed in " + understaffedMonths.length + " month(s)",
          suggestedAction: "Run the optimizer or auto-staff for this demand" });
      }

      if ((demand.requiredSkills || []).length){
        var anyGap = demand.requiredSkills.some(function(rs){
          return !activeEmployees.some(function(emp){
            var es = (state.employeeSkills || []).find(function(x){ return x.employeeId === emp.id && x.skillId === rs.skillId; });
            var level = es ? es.level : 0;
            return level >= rs.minLevel;
          });
        });
        if (anyGap){
          push({ severity:"MEDIUM", ruleId:"SKILL_GAP", subjectType:"demand", subjectId:demand.id,
            monthKeys: [], message: "No active employee meets all required skill minimums for demand '" + demand.title + "'",
            suggestedAction: "Upskill an employee or adjust required skill minimums" });
        }
      }
    });

    // TEAM_SIZE (per project per month)
    (state.projects || []).forEach(function(project){
      var prjMonths = idx.byProjectMonth.get(project.id);
      if (!prjMonths) return;
      var offenderMonths = [];
      prjMonths.forEach(function(rec, m){
        var size = rec.employeeIds.size;
        if (size < project.teamMin || size > project.teamMax) offenderMonths.push(m);
      });
      if (offenderMonths.length){
        push({ severity:"LOW", ruleId:"TEAM_SIZE", subjectType:"project", subjectId:project.id,
          monthKeys: offenderMonths.sort(), message: "Project '" + project.name + "' team size is outside [" + project.teamMin + ", " + project.teamMax + "] in " + offenderMonths.length + " month(s)",
          suggestedAction: "Adjust staffing to fit the target team size band" });
      }
    });

    return alerts;
  }

  return { scan: scan, consecutiveRuns: consecutiveRuns, severityForBurnout: severityForBurnout };
})();

/* ===================== BLOCK 7: ROE.mentor ===================== */
/* Pure. Mentorship pairing engine (§4.7). */
ROE.mentor = (function(){
  var C = ROE.const, U = ROE.util;

  function activeMenteeCount(state, mentorId){
    return (state.mentorships || []).filter(function(m){ return m.mentorId === mentorId && m.status === "Active"; }).length;
  }

  function empSkillLevel(state, employeeId, skillId){
    var es = (state.employeeSkills || []).find(function(x){ return x.employeeId === employeeId && x.skillId === skillId; });
    return es ? es.level : 0;
  }

  function sharedProject(state, empA, empB){
    var aProjects = new Set((state.assignments||[]).filter(function(a){ return a.employeeId === empA; }).map(function(a){ return a.projectId; }));
    var match = (state.assignments||[]).find(function(a){ return a.employeeId === empB && aProjects.has(a.projectId); });
    return match ? match.projectId : null;
  }

  function alreadyPaired(state, mentorId, menteeId){
    return (state.mentorships || []).some(function(m){
      return m.mentorId === mentorId && m.menteeId === menteeId && (m.status === "Active" || m.status === "Pending");
    });
  }

  function compatFor(score){
    if (score >= 75) return "High";
    if (score >= 50) return "Medium";
    return "Low";
  }

  // Computes a pairing score + focus skill for a specific mentor/mentee pair.
  function pairScoreFor(state, mentor, mentee){
    var skillIds = (C.SEED_SKILLS || []).map(function(s){ return s.code; });
    // Use whatever skills exist in the store (seeded or custom).
    var allSkillIds = (state.skills || []).map(function(s){ return s.id; });
    var bestSkillId = null, bestGapValue = -1;
    allSkillIds.forEach(function(skillId){
      var mentorLevel = empSkillLevel(state, mentor.id, skillId);
      var menteeLevel = empSkillLevel(state, mentee.id, skillId);
      var gapValue = 100 * U.clamp((mentorLevel - menteeLevel) / 3, 0, 1);
      if (gapValue > bestGapValue){ bestGapValue = gapValue; bestSkillId = skillId; }
    });
    var skillGapValue = bestGapValue < 0 ? 0 : bestGapValue;

    var mentorOrd = C.EMP_LEVEL_ORD[mentor.level] || 1;
    var menteeOrd = C.EMP_LEVEL_ORD[mentee.level] || 1;
    var delta = mentorOrd - menteeOrd;
    var seniorityDeltaValue = C.MENTOR_SENIORITY_DELTA_TABLE(delta);

    var disciplineValue;
    if (mentor.discipline === mentee.discipline) disciplineValue = 100;
    else if ((C.ADJACENCY[mentor.discipline]||[]).indexOf(mentee.discipline) !== -1) disciplineValue = 60;
    else disciplineValue = 20;

    var mentees = activeMenteeCount(state, mentor.id);
    if (mentees >= 2) return null; // excluded entirely
    var mentorSpareCapacityValue = 100 * (1 - mentees/2);

    var raw = 0.40*skillGapValue + 0.25*seniorityDeltaValue + 0.20*disciplineValue + 0.15*mentorSpareCapacityValue;
    var shared = sharedProject(state, mentor.id, mentee.id);
    if (shared) raw += 5;
    var pairScore = U.clamp(Math.round(raw), 0, 100);

    return {
      mentorId: mentor.id, menteeId: mentee.id, focusSkillId: bestSkillId,
      pairScore: pairScore, compat: compatFor(pairScore),
      sharedProjectId: shared,
      breakdown: { skillGapValue:skillGapValue, seniorityDeltaValue:seniorityDeltaValue, disciplineValue:disciplineValue, mentorSpareCapacityValue:mentorSpareCapacityValue, sharedBonus: shared ? 5 : 0 }
    };
  }

  // Suggests ranked mentor/mentee pairs, excluding mentors already at 2 active mentees,
  // excluding already-paired combinations, and excluding scores below 35.
  function suggest(state){
    var mentors = (state.employees || []).filter(function(e){ return e.active && e.mentorRole === "Mentor"; });
    var mentees = (state.employees || []).filter(function(e){ return e.active && e.mentorRole === "Mentee"; });
    var out = [];
    mentors.forEach(function(mentor){
      if (activeMenteeCount(state, mentor.id) >= 2) return;
      mentees.forEach(function(mentee){
        if (alreadyPaired(state, mentor.id, mentee.id)) return;
        var r = pairScoreFor(state, mentor, mentee);
        if (!r) return;
        if (r.pairScore < 35) return;
        out.push(r);
      });
    });
    out.sort(function(a,b){ return b.pairScore - a.pairScore; });
    return out;
  }

  return { suggest: suggest, pairScoreFor: pairScoreFor, activeMenteeCount: activeMenteeCount, compatFor: compatFor };
})();

/* ===================== BLOCK 8: ROE.io ===================== */
/* Pure workbook build/parse/template/CSV. SheetJS calls isolated to two thin adapters at the bottom. */
ROE.io = (function(){
  var C = ROE.const, U = ROE.util, M = ROE.model;

  var COLUMNS = {
    Meta: ["Key","Value"],
    CustomFieldDefs: ["EntityType","Key","Label","Type"],
    Employees: ["EmployeeID","Name","Email","Level","Discipline","Office","BusinessGroup","TargetUtil","MentorRole","Active","Notes"],
    Skills: ["SkillID","Code","Name","Category"],
    EmployeeSkills: ["EmployeeID","SkillID","Level","LevelLabel"],
    Projects: ["ProjectID","Name","Client","Market","Discipline","Phase","Budget","BIMLevel","TeamMin","TeamMax","Priority","Status","Software","Notes"],
    ProjectDemands: ["DemandID","ProjectID","Title","Discipline","MinLevel","Openings","RequiredSkills"],
    Assignments: ["AssignmentID","ProjectID","EmployeeID","DemandID","Status","Source","ScoreSnapshot"],
    Mentorships: ["MentorshipID","MentorID","MenteeID","FocusSkillID","SharedProjectID","Frequency","Score","Compat","Status"]
  };

  // Maps each entity sheet to its BUILD_PLAN_ADDENDUM_1.md custom-field entityType (§CF-1).
  // EmployeeSkills/Meta/CustomFieldDefs are not entity types and never get custom columns.
  var ENTITY_TYPE_BY_SHEET = {
    Employees:"Employee", Skills:"Skill", Projects:"Project",
    ProjectDemands:"Demand", Assignments:"Assignment", Mentorships:"Mentorship"
  };

  function monthCols(settings){ return U.monthKeys(settings.horizonStart, settings.horizonMonths); }

  // ---- Custom field helpers (IO-1) ----
  function customDefsFor(customFieldDefs, entityType){
    return (customFieldDefs || []).filter(function(d){ return d.entityType === entityType; });
  }
  function customCellsFor(rec, defs){
    return defs.map(function(d){
      var v = rec.custom ? rec.custom[d.key] : undefined;
      return (v === undefined || v === null) ? "" : v;
    });
  }
  // Parses the CustomFieldDefs sheet (EntityType | Key | Label | Type) into plain def-shaped rows.
  function parseCustomFieldDefsSheet(aoa){
    var result = { records: [], errors: [] };
    if (!aoa || aoa.length === 0) return result;
    var headers = aoa[0];
    var iEntity = headers.indexOf("EntityType"), iKey = headers.indexOf("Key"), iLabel = headers.indexOf("Label"), iType = headers.indexOf("Type");
    for (var r = 1; r < aoa.length; r++){
      var row = aoa[r];
      if (!row || row.every(function(c){ return c === undefined || c === "" || c === null; })) continue;
      var entityType = iEntity !== -1 ? row[iEntity] : undefined;
      var key = iKey !== -1 ? row[iKey] : undefined;
      var label = iLabel !== -1 ? row[iLabel] : undefined;
      var type = iType !== -1 ? row[iType] : undefined;
      if (!entityType || !key){
        result.errors.push({ sheet:"CustomFieldDefs", row:r+1, field:"Key", message:"EntityType and Key are required" });
        continue;
      }
      if (C.CUSTOM_FIELD_ENTITY_TYPES.indexOf(entityType) === -1){
        result.errors.push({ sheet:"CustomFieldDefs", row:r+1, field:"EntityType", message:"Unknown entity type '"+entityType+"'" });
        continue;
      }
      if (C.CUSTOM_FIELD_TYPES.indexOf(type) === -1) type = "text";
      result.records.push({ entityType: entityType, key: String(key), label: label || key, type: type });
    }
    return result;
  }

  function encodeRequiredSkills(arr){
    return (arr || []).map(function(rs){ return rs.skillId + ":" + rs.minLevel + ":" + rs.weight; }).join(";");
  }
  function decodeRequiredSkills(str){
    if (!str) return [];
    return String(str).split(";").filter(Boolean).map(function(part){
      var p = part.split(":");
      return { skillId: p[0], minLevel: parseInt(p[1],10) || 0, weight: parseInt(p[2],10) || 1 };
    });
  }

  // ---- Build sheets (AoA: array of arrays incl. header row) from canonical state ----
  function buildWorkbookSheets(state){
    var settings = state.settings;
    var months = monthCols(settings);
    var sheets = {};
    var cfd = state.customFieldDefs || [];
    var empDefs = customDefsFor(cfd,"Employee"), sklDefs = customDefsFor(cfd,"Skill"), prjDefs = customDefsFor(cfd,"Project"),
        demDefs = customDefsFor(cfd,"Demand"), asgDefs = customDefsFor(cfd,"Assignment"), menDefs = customDefsFor(cfd,"Mentorship");

    sheets.Meta = [
      ["Key","Value"],
      ["SchemaVersion", settings.schemaVersion],
      ["ExportedAt", U.nowIso()],
      ["HorizonStart", settings.horizonStart],
      ["HorizonMonths", settings.horizonMonths]
    ];

    // IO-1: one row per active custom field def, EntityType | Key | Label | Type.
    sheets.CustomFieldDefs = [COLUMNS.CustomFieldDefs].concat(cfd.map(function(d){
      return [d.entityType, d.key, d.label, d.type];
    }));

    sheets.Employees = [COLUMNS.Employees.concat(empDefs.map(function(d){return d.label;}))].concat((state.employees||[]).map(function(e){
      return [e.id, e.name, e.email, e.level, e.discipline, e.office, e.businessGroup, e.targetUtil, e.mentorRole, e.active, e.notes].concat(customCellsFor(e, empDefs));
    }));

    sheets.Skills = [COLUMNS.Skills.concat(sklDefs.map(function(d){return d.label;}))].concat((state.skills||[]).map(function(s){
      return [s.id, s.code, s.name, s.category].concat(customCellsFor(s, sklDefs));
    }));

    sheets.EmployeeSkills = [COLUMNS.EmployeeSkills].concat((state.employeeSkills||[]).map(function(es){
      return [es.employeeId, es.skillId, es.level, C.LEVEL_LABELS[es.level] || ""];
    }));

    sheets.Projects = [COLUMNS.Projects.concat(prjDefs.map(function(d){return d.label;}))].concat((state.projects||[]).map(function(p){
      return [p.id, p.name, p.client, p.market, p.discipline, p.phase, p.budget, p.bimLevel, p.teamMin, p.teamMax, p.priority, p.status, (p.software||[]).join(";"), p.notes].concat(customCellsFor(p, prjDefs));
    }));

    sheets.ProjectDemands = [COLUMNS.ProjectDemands.concat(months).concat(demDefs.map(function(d){return d.label;}))].concat((state.demands||[]).map(function(d){
      var base = [d.id, d.projectId, d.title, d.discipline, d.minLevel, d.openings, encodeRequiredSkills(d.requiredSkills)];
      var monthVals = months.map(function(m){ return d.allocationByMonth && d.allocationByMonth[m] !== undefined ? d.allocationByMonth[m] : ""; });
      return base.concat(monthVals).concat(customCellsFor(d, demDefs));
    }));

    sheets.Assignments = [COLUMNS.Assignments.concat(months).concat(asgDefs.map(function(d){return d.label;}))].concat((state.assignments||[]).map(function(a){
      var base = [a.id, a.projectId, a.employeeId, a.demandId || "", a.status, a.source, a.scoreSnapshot === null || a.scoreSnapshot === undefined ? "" : a.scoreSnapshot];
      var monthVals = months.map(function(m){ return a.allocationByMonth && a.allocationByMonth[m] !== undefined ? a.allocationByMonth[m] : ""; });
      return base.concat(monthVals).concat(customCellsFor(a, asgDefs));
    }));

    sheets.Mentorships = [COLUMNS.Mentorships.concat(menDefs.map(function(d){return d.label;}))].concat((state.mentorships||[]).map(function(m){
      return [m.id, m.mentorId, m.menteeId, m.focusSkillId, m.sharedProjectId || "", m.frequency, m.score, m.compat, m.status].concat(customCellsFor(m, menDefs));
    }));

    return sheets;
  }

  // `fieldDefs` (state.customFieldDefs) is optional for backward compatibility with any caller
  // that still passes just `settings`; template then simply has no custom columns/sheet.
  function buildTemplateSheets(settings, fieldDefs){
    var months = monthCols(settings);
    var cfd = fieldDefs || [];
    var empDefs = customDefsFor(cfd,"Employee"), sklDefs = customDefsFor(cfd,"Skill"), prjDefs = customDefsFor(cfd,"Project"),
        demDefs = customDefsFor(cfd,"Demand"), asgDefs = customDefsFor(cfd,"Assignment"), menDefs = customDefsFor(cfd,"Mentorship");
    function blanks(defs){ return defs.map(function(){ return ""; }); }
    var sheets = {};
    sheets.Meta = [
      ["Key","Value"],
      ["SchemaVersion", settings.schemaVersion],
      ["ExportedAt", U.nowIso()],
      ["HorizonStart", settings.horizonStart],
      ["HorizonMonths", settings.horizonMonths]
    ];
    sheets.CustomFieldDefs = [COLUMNS.CustomFieldDefs].concat(cfd.map(function(d){ return [d.entityType, d.key, d.label, d.type]; }));
    sheets.Skills = [COLUMNS.Skills.concat(sklDefs.map(function(d){return d.label;}))].concat(C.SEED_SKILLS.map(function(s){
      return ["skl_" + s.code.toLowerCase(), s.code, s.name, s.category].concat(blanks(sklDefs));
    }));
    sheets.Employees = [COLUMNS.Employees.concat(empDefs.map(function(d){return d.label;})),
      ["EXAMPLE-EMP-1","Jordan Example","jordan.example@example.com","Mid-Level","Civil","Example City, ST","Transportation",85,"None",true,"Example row - ignored on import"].concat(blanks(empDefs))];
    sheets.EmployeeSkills = [COLUMNS.EmployeeSkills, ["EXAMPLE-EMP-1","skl_civil3d",3,"Proficient"]];
    sheets.Projects = [COLUMNS.Projects.concat(prjDefs.map(function(d){return d.label;})),
      ["EXAMPLE-PRJ-1","Example Interchange Project","Example Client","Transportation","Civil","Planning",1000000,"BIM Level 2",4,10,3,"Active","skl_civil3d;skl_autocad","Example row - ignored on import"].concat(blanks(prjDefs))];
    sheets.ProjectDemands = [COLUMNS.ProjectDemands.concat(months).concat(demDefs.map(function(d){return d.label;})),
      ["EXAMPLE-DEM-1","EXAMPLE-PRJ-1","Example Civil Designer","Civil","Mid-Level",1,"skl_civil3d:3:2;skl_autocad:2:1"].concat(months.map(function(m,i){ return i < 2 ? 50 : ""; })).concat(blanks(demDefs))];
    sheets.Assignments = [COLUMNS.Assignments.concat(months).concat(asgDefs.map(function(d){return d.label;})),
      ["EXAMPLE-ASG-1","EXAMPLE-PRJ-1","EXAMPLE-EMP-1","EXAMPLE-DEM-1","Proposed","manual",""].concat(months.map(function(m,i){ return i < 2 ? 50 : ""; })).concat(blanks(asgDefs))];
    sheets.Mentorships = [COLUMNS.Mentorships.concat(menDefs.map(function(d){return d.label;})),
      ["EXAMPLE-MEN-1","EXAMPLE-EMP-1","EXAMPLE-EMP-1","skl_civil3d","","Monthly",0,"Low","Pending"].concat(blanks(menDefs))];
    return sheets;
  }

  function buildCsvForSheet(aoa){
    return aoa.map(function(row){ return U.csvRow(row); }).join("\r\n");
  }

  // ---- Header mapping detection ----
  // Returns { field: matchedHeader|null } for each canonical field in `sheetName`.
  // `customDefs` (optional, IO-1 fix round 2): the file's own CustomFieldDefs rows for this sheet's
  // entity type. Canonical fuzzy matching and custom-field positional matching must operate on
  // DISJOINT column sets, decided BEFORE fuzzy matching runs loosely - otherwise a deleted canonical
  // column (e.g. "Office") lets fuzzyMatchHeader's ~60-point substring match steal a genuine custom
  // column (e.g. "Office Location") that the CustomFieldDefs sheet says belongs to a custom field
  // (MGR-E). So: first claim exact canonical matches and month-key columns (unambiguous), then
  // reserve whichever of the remaining columns line up - by position AND header text - with the
  // file's own custom defs, and only THEN run fuzzy matching for any still-unmapped canonical field,
  // restricted to whatever is left over. Erring toward "leave unmapped, let the user resolve it in
  // the manual mapping UI" beats guessing.
  function detectMapping(sheetName, headers, customDefs){
    customDefs = customDefs || [];
    var fields = COLUMNS[sheetName] || [];
    var mapping = {};
    var claimed = {};
    fields.forEach(function(f){
      var exact = headers.find(function(h){ return U.normalizeHeader(h) === U.normalizeHeader(f); });
      mapping[f] = exact || null;
      if (exact){
        var idx = headers.indexOf(exact);
        if (idx !== -1) claimed[idx] = true;
      }
    });
    headers.forEach(function(h, i){ if (U.isMonthKey(h)) claimed[i] = true; });

    // Reserve columns that positionally AND textually match the file's own custom-field defs,
    // before fuzzy canonical matching gets a chance to see them.
    var leftoverForCustom = [];
    headers.forEach(function(h, i){ if (!claimed[i]) leftoverForCustom.push(i); });
    customDefs.forEach(function(def, i){
      var ci = leftoverForCustom[i];
      if (ci === undefined) return;
      if (String(headers[ci]) === String(def.label)) claimed[ci] = true;
    });

    var fuzzyCandidates = headers.filter(function(h, i){ return !claimed[i]; });
    fields.forEach(function(f){
      if (mapping[f]) return;
      mapping[f] = U.fuzzyMatchHeader(f, fuzzyCandidates) || null;
    });
    return mapping;
  }

  function colIndex(headers, headerName){
    return headers.indexOf(headerName);
  }

  // Parses one sheet's AoA into canonical records.
  // opts: { mapping: {field:header}, monthKeys: [...horizon month keys...] }
  // Returns { records:[], errors:[{sheet,row,field,message}], skipped:count, monthWarnings:[headerName,...] }
  // opts.customDefs (IO-1): defs (as recreated from the file's CustomFieldDefs sheet) for THIS
  // sheet's entity type only. Empty/absent means "no CustomFieldDefs sheet in this file" (or an
  // entity type with no custom columns) - old exports with no such sheet still import cleanly,
  // custom values are simply never read.
  function parseSheet(sheetName, aoa, opts){
    opts = opts || {};
    var result = { records: [], errors: [], skipped: 0, monthWarnings: [] };
    if (!aoa || aoa.length === 0) return result;
    var headers = aoa[0];
    var customDefs = opts.customDefs || [];
    var mapping = opts.mapping || detectMapping(sheetName, headers, customDefs);
    var horizonMonths = opts.monthKeys || [];
    var isWideMonths = sheetName === "ProjectDemands" || sheetName === "Assignments";
    var monthHeaderCols = [];
    if (isWideMonths){
      headers.forEach(function(h, i){
        if (U.isMonthKey(h)){
          if (horizonMonths.indexOf(h) !== -1) monthHeaderCols.push({ header:h, index:i });
          else result.monthWarnings.push(h);
        }
      });
    }

    function get(row, field){
      var h = mapping[field];
      if (!h) return undefined;
      var idx = colIndex(headers, h);
      return idx === -1 ? undefined : row[idx];
    }

    // Stashes which custom keys had a column present in this row as a non-enumerable property, so
    // it never shows up in Object.keys/JSON.stringify/deepEqual comparisons of the plain record
    // (e.g. the existing pure build->parse round-trip test), but STORE.upsert can still read (and
    // then strip) it via direct property access to drive the merge-not-replace fix for re-imports.
    function markImportedCustomKeys(rec, presentKeys){
      Object.defineProperty(rec, "__importedCustomKeys", { value: presentKeys, enumerable: false, configurable: true, writable: true });
      return rec;
    }

    // Reads this row's custom-field columns into { values, presentKeys }, matched by POSITION,
    // not by searching the header row for `def.label` text - but VERIFIED against the header text
    // actually found at that position before trusting it (fix round 2). buildWorkbookSheets always
    // appends exactly one column per active def (using the label purely as a human-readable
    // header), strictly after the canonical + month columns, in the same relative order that
    // `customDefsFor(entityType)` (i.e. `customDefs` here, filtered from the file's own
    // CustomFieldDefs sheet) preserves. So: figure out which header columns are already claimed by
    // a canonical field (via `mapping`) or by a month column (for wide-month sheets), then zip the
    // remaining "leftover" columns, left to right, against `customDefs`, in order - but only trust
    // the zip if the header text found at that position actually equals `def.label`. This means two
    // defs sharing an identical label, or a custom label colliding with a canonical column name
    // (e.g. "Name"), can never be confused with each other or with the canonical column when the
    // file is unedited - identity comes from the file's CustomFieldDefs sheet order, never from
    // re-deriving a match off printed label text (the bug `headers.indexOf(def.label)` had).
    //
    // A structural edit to the exported file (inserting/removing a column, or reordering the
    // CustomFieldDefs sheet's rows) is exactly what breaks the position-only assumption - hand-
    // editing the exported workbook is the whole point of the export/import feature, so this must
    // not be allowed to silently misassign a value. When the header at the expected position does
    // NOT match `def.label`, do not guess: report a per-row/per-column error naming the sheet and
    // the expected field, and leave that key untouched (never populate it, never mark it present -
    // so STORE.upsert's merge treats it exactly like "column absent", preserving any existing
    // stored value, not clearing it).
    //
    // presentKeys lists every def.key whose column was verified present in this row's sheet AND
    // successfully read (a genuinely blank cell counts as present - it is an explicit, intentional
    // clear; a parse failure does not, so it never wipes the existing stored value - see the
    // Number-column fix below). Used by STORE.upsert to distinguish "column absent from this
    // import" (leave the existing stored value alone) from "column present but cell blank" (an
    // explicit clear) on re-import (see BUILD_PLAN_ADDENDUM_1.md's "never silently delete data"
    // principle).
    function readCustom(row, rowNum){
      var out = { values: {}, presentKeys: [] };
      if (!customDefs.length) return out;
      var claimed = {};
      (COLUMNS[sheetName] || []).forEach(function(field){
        var h = mapping[field];
        if (!h) return;
        var idx = colIndex(headers, h);
        if (idx !== -1) claimed[idx] = true;
      });
      if (isWideMonths){
        headers.forEach(function(h, i){ if (U.isMonthKey(h)) claimed[i] = true; });
      }
      var leftover = [];
      headers.forEach(function(h, i){ if (!claimed[i]) leftover.push(i); });

      customDefs.forEach(function(def, i){
        var ci = leftover[i];
        if (ci === undefined) return; // no column present in this file for this def at all
        var headerText = headers[ci];
        if (String(headerText === undefined || headerText === null ? "" : headerText) !== String(def.label)){
          // Structural edit shifted columns out of alignment (inserted/removed column, reordered
          // CustomFieldDefs rows, etc.) - do not guess-assign. Report and leave the key untouched.
          result.errors.push({ sheet: sheetName, row: rowNum, field: def.label, message: "Expected custom column '" + def.label + "' but found '" + (headerText === undefined || headerText === null ? "" : headerText) + "' at that position - value not imported (column order may have changed; re-export or fix the sheet layout)" });
          return;
        }
        var raw = row[ci];
        if (raw === undefined || raw === "" || raw === null){
          out.presentKeys.push(def.key); // present but blank = explicit clear
          return;
        }
        if (def.type === "number"){
          var n = typeof raw === "number" ? raw : parseFloat(raw);
          if (isNaN(n)){
            result.errors.push({ sheet: sheetName, row: rowNum, field: def.label, message: "'" + def.label + "' must be a number" });
            return; // do NOT mark presentKeys - leave the existing stored value untouched, not cleared
          }
          out.presentKeys.push(def.key);
          out.values[def.key] = n;
        } else {
          out.presentKeys.push(def.key);
          out.values[def.key] = String(raw);
        }
      });
      return out;
    }

    for (var r = 1; r < aoa.length; r++){
      var row = aoa[r];
      if (!row || row.every(function(c){ return c === undefined || c === "" || c === null; })) continue;
      var rowNum = r + 1;
      var idField = COLUMNS[sheetName][0];
      var idVal = get(row, idField);
      if (idVal && String(idVal).indexOf("EXAMPLE-") === 0){ result.skipped += 1; continue; }
      var customParsed = readCustom(row, rowNum);

      var rec, valid;
      if (sheetName === "Employees"){
        rec = M.newEmployee({
          id: idVal || undefined, name: get(row,"Name"), email: get(row,"Email"), level: get(row,"Level"),
          discipline: get(row,"Discipline"), office: get(row,"Office"), businessGroup: get(row,"BusinessGroup"),
          targetUtil: U.parseNum(get(row,"TargetUtil"), 85), mentorRole: get(row,"MentorRole") || "None",
          active: get(row,"Active") === undefined ? true : (get(row,"Active") === true || get(row,"Active") === "true" || get(row,"Active") === 1 || get(row,"Active") === "TRUE"),
          notes: get(row,"Notes"), custom: customParsed.values
        });
        markImportedCustomKeys(rec, customParsed.presentKeys);
        valid = M.validateEmployee(rec, customDefs);
      } else if (sheetName === "Skills"){
        rec = M.newSkill({ id: idVal || undefined, code: get(row,"Code"), name: get(row,"Name"), category: get(row,"Category"), custom: customParsed.values });
        markImportedCustomKeys(rec, customParsed.presentKeys);
        valid = M.validateSkill(rec, customDefs);
      } else if (sheetName === "EmployeeSkills"){
        rec = M.newEmployeeSkill({ employeeId: get(row,"EmployeeID"), skillId: get(row,"SkillID"), level: M.normalizeSkillLevel(get(row,"Level")) });
        valid = M.validateEmployeeSkill(rec);
      } else if (sheetName === "Projects"){
        var swRaw = get(row,"Software");
        rec = M.newProject({
          id: idVal || undefined, name: get(row,"Name"), client: get(row,"Client"), market: get(row,"Market"),
          discipline: get(row,"Discipline"), phase: get(row,"Phase"), budget: U.parseNum(get(row,"Budget"),0),
          bimLevel: get(row,"BIMLevel"), teamMin: U.parseNum(get(row,"TeamMin"),1), teamMax: U.parseNum(get(row,"TeamMax"),10),
          priority: U.parseNum(get(row,"Priority"),3), status: get(row,"Status"),
          software: swRaw ? String(swRaw).split(";").filter(Boolean) : [], notes: get(row,"Notes"), custom: customParsed.values
        });
        markImportedCustomKeys(rec, customParsed.presentKeys);
        valid = M.validateProject(rec, customDefs);
      } else if (sheetName === "ProjectDemands"){
        var alloc = {};
        monthHeaderCols.forEach(function(mc){
          var v = row[mc.index];
          if (v !== undefined && v !== "") alloc[mc.header] = U.parseNum(v, 0);
        });
        rec = M.newDemand({
          id: idVal || undefined, projectId: get(row,"ProjectID"), title: get(row,"Title"), discipline: get(row,"Discipline"),
          minLevel: get(row,"MinLevel"), openings: U.parseNum(get(row,"Openings"),1),
          requiredSkills: decodeRequiredSkills(get(row,"RequiredSkills")), allocationByMonth: alloc, custom: customParsed.values
        });
        markImportedCustomKeys(rec, customParsed.presentKeys);
        valid = M.validateDemand(rec, customDefs);
      } else if (sheetName === "Assignments"){
        var alloc2 = {};
        monthHeaderCols.forEach(function(mc){
          var v = row[mc.index];
          if (v !== undefined && v !== "") alloc2[mc.header] = U.parseNum(v, 0);
        });
        rec = M.newAssignment({
          id: idVal || undefined, projectId: get(row,"ProjectID"), employeeId: get(row,"EmployeeID"),
          demandId: get(row,"DemandID") || null, status: get(row,"Status") || "Proposed", source: get(row,"Source") || "import",
          scoreSnapshot: get(row,"ScoreSnapshot") === "" || get(row,"ScoreSnapshot") === undefined ? null : U.parseNum(get(row,"ScoreSnapshot"), null),
          allocationByMonth: alloc2, custom: customParsed.values
        });
        markImportedCustomKeys(rec, customParsed.presentKeys);
        valid = M.validateAssignment(rec, customDefs);
      } else if (sheetName === "Mentorships"){
        rec = M.newMentorship({
          id: idVal || undefined, mentorId: get(row,"MentorID"), menteeId: get(row,"MenteeID"), focusSkillId: get(row,"FocusSkillID"),
          sharedProjectId: get(row,"SharedProjectID") || null, frequency: get(row,"Frequency"),
          score: U.parseNum(get(row,"Score"),0), compat: get(row,"Compat"), status: get(row,"Status"), custom: customParsed.values
        });
        markImportedCustomKeys(rec, customParsed.presentKeys);
        valid = M.validateMentorship(rec, customDefs);
      } else {
        continue;
      }

      if (!valid.ok){
        valid.errors.forEach(function(e){
          result.errors.push({ sheet: sheetName, row: rowNum, field: e.field, message: e.message });
        });
      } else {
        result.records.push(rec);
      }
    }
    return result;
  }

  // Parses a full workbook (object of sheetName -> AoA). mappings: optional per-sheet mapping
  // override. `existingFieldDefs` (state.customFieldDefs) is used only to decide which defs found
  // in the file's CustomFieldDefs sheet are new locally (out.fieldDefs.toAdd) - per IO-1, a local
  // def is NEVER deleted just because the file doesn't have it.
  // IO-1 backward compatibility: if the file has no CustomFieldDefs sheet at all (older export),
  // out.fieldDefs.fromFile stays empty and no entity sheet's custom columns are read at all - this
  // is "no custom values", not an error.
  function parseWorkbook(sheetsAoA, settings, mappings, existingFieldDefs){
    existingFieldDefs = existingFieldDefs || [];
    var horizonMonths = U.monthKeys(settings.horizonStart, settings.horizonMonths);
    var out = { bySheet: {}, monthWarnings: [], fieldDefs: { fromFile: [], toAdd: [], errors: [] } };

    if (sheetsAoA.CustomFieldDefs){
      var cfdParsed = parseCustomFieldDefsSheet(sheetsAoA.CustomFieldDefs);
      out.fieldDefs.fromFile = cfdParsed.records;
      out.fieldDefs.errors = cfdParsed.errors;
      cfdParsed.records.forEach(function(fd){
        var existsLocally = existingFieldDefs.some(function(ed){ return ed.entityType === fd.entityType && ed.key === fd.key; });
        if (!existsLocally) out.fieldDefs.toAdd.push(fd);
      });
    }

    Object.keys(COLUMNS).forEach(function(sheetName){
      if (sheetName === "Meta" || sheetName === "CustomFieldDefs") return;
      var aoa = sheetsAoA[sheetName];
      if (!aoa) return;
      var entityType = ENTITY_TYPE_BY_SHEET[sheetName];
      var customDefs = entityType ? out.fieldDefs.fromFile.filter(function(d){ return d.entityType === entityType; }) : [];
      var r = parseSheet(sheetName, aoa, { mapping: mappings && mappings[sheetName], monthKeys: horizonMonths, customDefs: customDefs });
      out.bySheet[sheetName] = r;
      if (r.monthWarnings.length) out.monthWarnings.push({ sheet: sheetName, headers: r.monthWarnings });
    });
    return out;
  }

  // Computes insert/update/skip/error preview counts against existing state, matching by ID.
  function diffAgainstState(state, parsed){
    var summary = {};
    var entityKeyBySheet = { Employees:"employees", Skills:"skills", EmployeeSkills:null, Projects:"projects", ProjectDemands:"demands", Assignments:"assignments", Mentorships:"mentorships" };
    Object.keys(parsed.bySheet).forEach(function(sheetName){
      var r = parsed.bySheet[sheetName];
      var stateKey = entityKeyBySheet[sheetName];
      var existingIds = new Set();
      if (stateKey) (state[stateKey] || []).forEach(function(rec){ existingIds.add(rec.id); });
      var inserts = 0, updates = 0;
      if (sheetName === "EmployeeSkills"){
        inserts = r.records.length; // long-format upserts, treated as inserts/updates by composite key elsewhere
      } else {
        r.records.forEach(function(rec){
          if (existingIds.has(rec.id)) updates += 1; else inserts += 1;
        });
      }
      summary[sheetName] = { insert: inserts, update: updates, skipped: r.skipped, errors: r.errors.length };
    });
    if (parsed.fieldDefs){
      summary.CustomFieldDefs = { insert: parsed.fieldDefs.toAdd.length, update: 0, skipped: 0, errors: parsed.fieldDefs.errors.length };
    }
    return summary;
  }

  return {
    COLUMNS: COLUMNS, monthCols: monthCols, ENTITY_TYPE_BY_SHEET: ENTITY_TYPE_BY_SHEET,
    encodeRequiredSkills: encodeRequiredSkills, decodeRequiredSkills: decodeRequiredSkills,
    buildWorkbookSheets: buildWorkbookSheets, buildTemplateSheets: buildTemplateSheets,
    buildCsvForSheet: buildCsvForSheet, detectMapping: detectMapping,
    customDefsFor: customDefsFor, customCellsFor: customCellsFor, parseCustomFieldDefsSheet: parseCustomFieldDefsSheet,
    parseSheet: parseSheet, parseWorkbook: parseWorkbook, diffAgainstState: diffAgainstState,

    // ---- Thin SheetJS adapters (impure: touch window.XLSX / trigger downloads) ----
    isXlsxAvailable: function(){ return typeof window !== "undefined" && !!window.XLSX; },

    exportWorkbookFile: function(state, filename){
      if (!window.XLSX) throw new Error("XLSX library is not available");
      var sheets = buildWorkbookSheets(state);
      var wb = window.XLSX.utils.book_new();
      Object.keys(sheets).forEach(function(name){
        var ws = window.XLSX.utils.aoa_to_sheet(sheets[name]);
        window.XLSX.utils.book_append_sheet(wb, ws, name);
      });
      window.XLSX.writeFile(wb, filename || "roe-export.xlsx");
    },

    exportTemplateFile: function(settings, fieldDefs, filename){
      if (!window.XLSX) throw new Error("XLSX library is not available");
      var sheets = buildTemplateSheets(settings, fieldDefs);
      var wb = window.XLSX.utils.book_new();
      Object.keys(sheets).forEach(function(name){
        var ws = window.XLSX.utils.aoa_to_sheet(sheets[name]);
        window.XLSX.utils.book_append_sheet(wb, ws, name);
      });
      window.XLSX.writeFile(wb, filename || "roe-template.xlsx");
    },

    // Reads a File object (from an <input type=file>) and returns a Promise resolving to
    // a plain { sheetName: AoA } object (pure data), via SheetJS.
    readWorkbookFile: function(file){
      if (!window.XLSX) return Promise.reject(new Error("XLSX library is not available"));
      return new Promise(function(resolve, reject){
        var reader = new FileReader();
        reader.onload = function(e){
          try {
            var data = new Uint8Array(e.target.result);
            var wb = window.XLSX.read(data, { type: "array" });
            var out = {};
            wb.SheetNames.forEach(function(name){
              out[name] = window.XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, blankrows:false, defval:"" });
            });
            resolve(out);
          } catch (err){ reject(err); }
        };
        reader.onerror = function(){ reject(reader.error); };
        reader.readAsArrayBuffer(file);
      });
    }
  };
})();

   Original names and records - not copied from any reference application.
   Distributions are deliberately shaped so every one of the 8 alert rules (§4.6) fires at least once. */
ROE.demo = (function(){
  var C = ROE.const, U = ROE.util, M = ROE.model;

  var FIRST_NAMES = ["Marisol","Deshawn","Priya","Callum","Noor","Devon","Sofia","Kai","Elena","Trevor",

  function skillId(code){ return "skl_" + code.toLowerCase(); }

  function skillsForDiscipline(discipline, seedIdx){
    var v = seedIdx % 5;
    var out = [];
    function add(code, base){ out.push({ skillId: skillId(code), level: U.clamp(base + (v % 3) - 1, 0, 5) }); }
    if (["Civil","Geotechnical","Environmental","Landscape"].indexOf(discipline) !== -1){
      add("CIVIL3D", 3); add("AUTOCAD", 3); add("GIS", U.clamp(2 + (v%2), 0, 4)); add("PM", 1);
    } else if (["Architecture","VDC","Structural","MEP"].indexOf(discipline) !== -1){
      add("REVIT", 3); add("NAVIS", 2); add("BLUEBEAM", 2); add("AUTOCAD", 2); add("PM", 1);
    } else { // Data/Analytics
      add("PYTHON", 3); add("GIS", U.clamp(2 + (v%2), 0, 4)); add("PM", 1);
    }

  }

  function buildEmployees(){
    var employees = [];

    function allocAll(pct){ var o = {}; months.forEach(function(m){ o[m] = pct; }); return o; }

    var demands = [];

      demands.push(M.newDemand({

    add(e4, "prj_9", null, allocRange(90, 0, 4), "manual");

    return assignments;

  function buildMentorships(){

  }

  return { build: build };
})();

/* Impure, isolated: fetch, field mapping, diff, push. Token lives ONLY in the _session closure variable -
   never in the persisted config object, never in IndexedDB/localStorage/sessionStorage/exports. */
ROE.api = (function(){
  var U = ROE.util;
  var _session = { token: null };

  function ApiError(message, status, isCors){
    this.message = message; this.status = status || null; this.isCors = !!isCors;
    this.name = "ApiError";
  }
  ApiError.prototype = Object.create(Error.prototype);

  function setToken(t){ _session.token = t || null; }
  function clearToken(){ _session.token = null; }
  function hasToken(){ return !!_session.token; }

  function getByPath(obj, path){
    if (!path) return obj;
    return path.split(".").reduce(function(o,k){ return (o !== undefined && o !== null) ? o[k] : undefined; }, obj);
  }

  function buildUrl(baseUrl, path){
    return String(baseUrl || "").replace(/\/$/, "") + path;
  }

  function buildHeaders(config){
    var headers = { "Content-Type": "application/json" };
    if (config.authMode === "apiKey" && _session.token){
      headers[config.authHeaderName || "X-API-Key"] = _session.token;
    } else if (config.authMode === "bearer" && _session.token){
      headers["Authorization"] = "Bearer " + _session.token;
    }
    return headers;
  }

  function extractArray(json, responseRoot){
    var arr = responseRoot ? getByPath(json, responseRoot) : json;
    if (!Array.isArray(arr)){
      return { error: "Response is not a JSON array" + (responseRoot ? " at '" + responseRoot + "'" : "") + "." };
    }
    return { data: arr };
  }

  function applyFieldMapping(remoteRec, mapping){
    var out = {};
    for (var field in (mapping || {})){
      out[field] = getByPath(remoteRec, mapping[field]);
    }
    // Fields with no mapping fall through untouched if they already look canonical.
    if (remoteRec && typeof remoteRec === "object" && remoteRec.id !== undefined && out.id === undefined) out.id = remoteRec.id;
    return out;
  }

  function doFetch(url, options, timeoutMs){
    var controller = (typeof AbortController !== "undefined") ? new AbortController() : null;
    var timer = null;
    if (controller){
      options = Object.assign({}, options, { signal: controller.signal });
      timer = setTimeout(function(){ controller.abort(); }, timeoutMs || 15000);
    }
    return fetch(url, options).then(function(res){
      if (timer) clearTimeout(timer);
      return res;
    }).catch(function(err){
      if (timer) clearTimeout(timer);
      if (err && err.name === "AbortError"){
        throw new ApiError("Request timed out after " + (timeoutMs||15000) + "ms.", null, false);
      }
      // A fetch TypeError with no HTTP status reaching the browser is the classic CORS-block signature.
      throw new ApiError("Request failed with no HTTP response - this is almost always a CORS block: the target API must return Access-Control-Allow-Origin (and allow your auth header via Access-Control-Allow-Headers). There is no proxy; this app has no server component.", null, true);
    });
  }

  // Pull one entity: fetch -> extract array -> apply field mapping. Returns a Promise<Array<canonicalPartial>>.
  function pull(config, entityName, mapping){
    var entity = config.entities[entityName];
    if (!entity || !entity.enabled) return Promise.reject(new ApiError("Entity '" + entityName + "' is not enabled.", null));
    var url = buildUrl(config.baseUrl, entity.pullPath);
    return doFetch(url, { method: "GET", headers: buildHeaders(config) }, config.timeoutMs).then(function(res){
      if (!res.ok){
        return res.text().then(function(t){
          throw new ApiError("HTTP " + res.status + " " + res.statusText + (t ? (": " + t.slice(0,200)) : ""), res.status, false);
        });
      }
      return res.json();
    }).then(function(json){
      var extracted = extractArray(json, entity.responseRoot);
      if (extracted.error) throw new ApiError(extracted.error, null, false);
      return extracted.data.map(function(r){ return applyFieldMapping(r, mapping); });
    });
  }

  // Computes adds/updates/unchanged between local records and freshly pulled remote records.
  // `lastSnapshotById` is the last-pulled snapshot (for detecting unsaved local edits).
  function diffPull(localRecords, remoteRecords, lastSnapshotById, idField){
    idField = idField || "id";
    var localById = {};
    (localRecords || []).forEach(function(r){ localById[r[idField]] = r; });
    var snapshotById = lastSnapshotById || {};
    var adds = [], updates = [], unchanged = [];
    (remoteRecords || []).forEach(function(remote){
      var id = remote[idField];
      var local = localById[id];
      if (!local){ adds.push({ id: id, remote: remote }); return; }
      var snap = snapshotById[id];
      var localEdited = !!(snap && !U.deepEqual(local, snap));
      var fieldsChanged = [];
      for (var k in remote){
        if (!U.deepEqual(local[k], remote[k])) fieldsChanged.push({ field: k, before: local[k], after: remote[k] });
      }
      if (fieldsChanged.length === 0){ unchanged.push({ id: id }); return; }
      // Records with unsaved local edits default to "keep local"; remote never silently overwrites them.
      updates.push({ id: id, fields: fieldsChanged, localEdited: localEdited, applyRemote: !localEdited });
    });
    return { adds: adds, updates: updates, unchanged: unchanged };
  }

  // Computes the push diff: local state vs. the last-pulled remote snapshot.
  function diffPush(localRecords, lastSnapshotById, idField){
    idField = idField || "id";
    var snapshotById = lastSnapshotById || {};
    var toCreate = [], toUpdate = [];
    (localRecords || []).forEach(function(local){
      var snap = snapshotById[local[idField]];
      if (!snap){ toCreate.push(local); return; }
      if (!U.deepEqual(local, snap)) toUpdate.push(local);
    });
    return { toCreate: toCreate, toUpdate: toUpdate };
  }

  function push(config, entityName, records){
    var entity = config.entities[entityName];
    if (!entity || !entity.enabled) return Promise.reject(new ApiError("Entity '" + entityName + "' is not enabled.", null));
    var url = buildUrl(config.baseUrl, entity.pushPath);
    var headers = buildHeaders(config);
    if (entity.pushMode === "bulk"){
      return doFetch(url, { method: entity.pushMethod || "POST", headers: headers, body: JSON.stringify(records) }, config.timeoutMs)
        .then(function(res){
          if (!res.ok) throw new ApiError("HTTP " + res.status + " " + res.statusText, res.status, false);
          return res.json().catch(function(){ return null; });
        });
    }
    // perRecord
    return Promise.all(records.map(function(rec){
      return doFetch(url, { method: entity.pushMethod || "POST", headers: headers, body: JSON.stringify(rec) }, config.timeoutMs)
        .then(function(res){
          if (!res.ok) throw new ApiError("HTTP " + res.status + " " + res.statusText + " for record " + rec[entity.idField||"id"], res.status, false);
          return res.json().catch(function(){ return null; });
        });
    }));
  }

  return {
    ApiError: ApiError,
    setToken: setToken, clearToken: clearToken, hasToken: hasToken,
    _session: _session,
    getByPath: getByPath, buildUrl: buildUrl, buildHeaders: buildHeaders,
    extractArray: extractArray, applyFieldMapping: applyFieldMapping,
    pull: pull, push: push, diffPull: diffPull, diffPush: diffPush
  };
})();
