/* Impure, isolated: IndexedDB wrapper. Database "roe", version 1. */
ROE.db = (function(){
  var DB_NAME = "roe";
  // Bumped 1 -> 2 by BUILD_PLAN_ADDENDUM_1.md for the new `customFieldDefs` store. Per §2.6's
  // migration ladder: IndexedDB's own onupgradeneeded (below) generically creates any STORE_DEFS
  // entry an existing installation is missing, regardless of what version it was opened at, so
  // every v1 install gains the empty `customFieldDefs` store with zero changes to its existing
  // data. MIGRATIONS below covers any additional data-shaping a future bump might need; v1 -> v2
  // needs none (existing records simply have no `custom` key yet, which ROE.model treats as valid).
  var DB_VERSION = 2;
  // Note: an `employeeSkills` store is added beyond §2.6's literal list because EmployeeSkill
  // records are part of the canonical model (§3) and must survive reload (N-6); everything else
  // matches §2.6 exactly (out-of-line keyed stores for settings/meta/employeeSkills).
  var STORE_DEFS = [
    { name:"employees", opts:{ keyPath:"id" } },
    { name:"projects", opts:{ keyPath:"id" } },
    { name:"demands", opts:{ keyPath:"id" } },
    { name:"assignments", opts:{ keyPath:"id" } },
    { name:"mentorships", opts:{ keyPath:"id" } },
    { name:"skills", opts:{ keyPath:"id" } },
    { name:"employeeSkills", opts:{} },
    { name:"customFieldDefs", opts:{ keyPath:"id" } },
    { name:"settings", opts:{} },
    { name:"meta", opts:{} }
  ];

  // ---- Migration ladder (BUILD_PLAN.md §2.6 / BUILD_PLAN_ADDENDUM_1.md "Migration") ----
  // Keyed by target schemaVersion. Each step runs once, in order, the first time an install's
  // stored meta.schemaVersion is found to be behind DB_VERSION (see runMigrationLadder / ROE.store.load).
  var MIGRATIONS = {
    2: function(){
      // v1 -> v2: the customFieldDefs object store itself is already created generically above
      // (onupgradeneeded creates any STORE_DEFS entry not yet present). No existing record needs
      // to change shape: `record.custom` absent is valid, not a defect, per CF-4. No-op.
      return Promise.resolve();
    }
  };

  function runMigrationLadder(fromVersion){
    var from = fromVersion || 0;
    var steps = [];
    for (var v = from + 1; v <= DB_VERSION; v++){
      if (MIGRATIONS[v]) steps.push(MIGRATIONS[v]);
    }
    return steps.reduce(function(p, fn){ return p.then(fn); }, Promise.resolve());
  }

  var _dbPromise = null;

  function isAvailable(){
    return typeof indexedDB !== "undefined" && indexedDB !== null;
  }

  function open(){
    if (_dbPromise) return _dbPromise;
    _dbPromise = new Promise(function(resolve, reject){
      if (!isAvailable()){ reject(new Error("IndexedDB is not available in this browser/context.")); return; }
      var req;
      try { req = indexedDB.open(DB_NAME, DB_VERSION); }
      catch (e){ reject(e); return; }
      req.onupgradeneeded = function(e){
        var db = e.target.result;
        STORE_DEFS.forEach(function(def){
          if (!db.objectStoreNames.contains(def.name)) db.createObjectStore(def.name, def.opts);
        });
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error || new Error("Failed to open IndexedDB")); };
      req.onblocked = function(){ reject(new Error("IndexedDB open blocked by another tab")); };
    });
    return _dbPromise;
  }

  function readAll(storeName){
    return open().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(storeName, "readonly");
        var store = tx.objectStore(storeName);
        var req = store.getAll();
        req.onsuccess = function(){ resolve(req.result || []); };
        req.onerror = function(){ reject(req.error); };
      });
    });
  }

  function getRecord(storeName, key){
    return open().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(storeName, "readonly");
        var req = tx.objectStore(storeName).get(key);
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ reject(req.error); };
      });
    });
  }

  function putRecord(storeName, value, key){
    return open().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(storeName, "readwrite");
        var req = key !== undefined ? tx.objectStore(storeName).put(value, key) : tx.objectStore(storeName).put(value);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error || req.error); };
      });
    });
  }

  // Replaces the entire contents of a keyPath store with `records` (array of plain objects with `id`).
  function replaceAll(storeName, records){
    return open().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(storeName, "readwrite");
        var store = tx.objectStore(storeName);
        store.clear();
        (records || []).forEach(function(r){ store.put(r); });
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }

  // Replaces the entire contents of an out-of-line-keyed store using keyFn(record) -> key.
  function replaceAllKeyed(storeName, records, keyFn){
    return open().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(storeName, "readwrite");
        var store = tx.objectStore(storeName);
        store.clear();
        (records || []).forEach(function(r){ store.put(r, keyFn(r)); });
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }

  function clearAll(){
    return open().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(STORE_DEFS.map(function(d){ return d.name; }), "readwrite");
        STORE_DEFS.forEach(function(def){ tx.objectStore(def.name).clear(); });
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }

  function deleteDatabase(){
    _dbPromise = null;
    return new Promise(function(resolve, reject){
      var req = indexedDB.deleteDatabase(DB_NAME);
      req.onsuccess = function(){ resolve(); };
      req.onerror = function(){ reject(req.error); };
      req.onblocked = function(){ resolve(); };
    });
  }

  // Dedicated preference write, deliberately NOT gated by the sessionOnly check (that check lives
  // in ROE.store.scheduleSave/persist, not here). Stored under its own key ("prefs") in the same
  // out-of-line-keyed "settings" store used for the full settings record ("app"), so no schema
  // version bump is needed. Only ever holds {sessionOnly, theme} - nothing else - per the resolved
  // design decision: this is the one write path that must survive flipping session-only ON.
  function savePreference(prefs){ return putRecord("settings", prefs, "prefs"); }
  function loadPreference(){ return getRecord("settings", "prefs"); }

  return {
    STORE_DEFS: STORE_DEFS, DB_VERSION: DB_VERSION, isAvailable: isAvailable, open: open,
    readAll: readAll, getRecord: getRecord, putRecord: putRecord,
    replaceAll: replaceAll, replaceAllKeyed: replaceAllKeyed,
    clearAll: clearAll, deleteDatabase: deleteDatabase,
    savePreference: savePreference, loadPreference: loadPreference,
    runMigrationLadder: runMigrationLadder
  };
})();

/* ===================== BLOCK 11: ROE.store ===================== */
/* Impure: in-memory canonical state, mutations, dirty flag, debounced save, subscribe/notify. */
ROE.store = (function(){
  var C = ROE.const, U = ROE.util, DB = ROE.db, CALC = ROE.calc;

  var state = {
    employees: [], skills: [], employeeSkills: [], projects: [], demands: [], assignments: [], mentorships: [],
    customFieldDefs: [],
    settings: U.clone(C.DEFAULT_SETTINGS)
  };

  var listeners = [];
  var dirty = true;
  var cachedIdx = null;
  var saveTimer = null;
  var lastPulledSnapshots = {}; // entityName -> {id: record} - for the API diff/push flow

  // True only once in-memory state genuinely reflects IndexedDB (or has been explicitly wiped in
  // sync with it, e.g. clearAll). False while in-memory state was populated by the session-only
  // skip-load branch of load() (real IndexedDB data may still exist on disk but was never read into
  // memory) or before the very first load() completes. `hydrated` - not `state.settings.sessionOnly`
  // - is the SOLE gate on whether scheduleSave/persist actually write anything (see round-3 fix
  // below). It only ever changes inside load() and clearAll(), i.e. on an actual page reload or an
  // explicit clear, so real write behavior can never change mid-session no matter how many times the
  // session-only checkbox is flipped. Toggling the checkbox writes the out-of-band preference (for
  // the *next* load()) and updates `state.settings.sessionOnly` purely as a UI/preview value; it
  // deliberately does not touch `hydrated`, so writes keep behaving exactly as they already were
  // until the user reloads.
  var hydrated = false;

  function notify(){ listeners.forEach(function(fn){ fn(state); }); }
  function subscribe(fn){
    listeners.push(fn);
    return function(){ listeners = listeners.filter(function(f){ return f !== fn; }); };
  }

  function markDirty(){ dirty = true; cachedIdx = null; }

  function getIndexes(){
    if (dirty || !cachedIdx){ cachedIdx = CALC.buildIndexes(state); dirty = false; }
    return cachedIdx;
  }

  function getState(){ return state; }

  function whitelistSettings(settings){
    // Serializer whitelist: strips any `token` field by construction. The token itself never
    // lives here anyway (it's ROE.api._session.token), this is defense in depth.
    var copy = U.clone(settings);
    if (copy.api && copy.api.token !== undefined) delete copy.api.token;
    return copy;
  }

  function scheduleSave(){
    // Gated on `hydrated` alone - see the comment on its declaration above. Deliberately does NOT
    // also check `state.settings.sessionOnly`: that flag can be flipped by the user mid-session
    // without changing `hydrated`, and real writes must not change behavior until reload either way.
    if (!hydrated) return; // never schedule a write against not-yet-rehydrated in-memory state
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ persist(); }, 400);
  }

  function persist(){
    if (!hydrated) return Promise.resolve(); // guard against clobbering IndexedDB with stale/empty memory
    if (!DB.isAvailable()) return Promise.resolve();
    return Promise.all([
      DB.replaceAll("employees", state.employees),
      DB.replaceAll("projects", state.projects),
      DB.replaceAll("demands", state.demands),
      DB.replaceAll("assignments", state.assignments),
      DB.replaceAll("mentorships", state.mentorships),
      DB.replaceAll("skills", state.skills),
      DB.replaceAllKeyed("employeeSkills", state.employeeSkills, function(r){ return r.employeeId + "|" + r.skillId; }),
      DB.replaceAll("customFieldDefs", state.customFieldDefs),
      DB.putRecord("settings", whitelistSettings(state.settings), "app"),
      DB.putRecord("meta", { schemaVersion: C.SCHEMA_VERSION }, "schemaVersion")
    ]).catch(function(err){ console.error("ROE.store persist failed", err); });
  }

  function load(){
    if (!DB.isAvailable()){
      state.settings.sessionOnly = true;
      hydrated = false;
      markDirty(); notify();
      return Promise.resolve({ fellBackToSessionOnly: true, empty: true });
    }
    // Read the dedicated, out-of-band preference flag FIRST. It is written on every sessionOnly
    // toggle (on or off) regardless of the sessionOnly value at the time, so it is the source of
    // truth for boot - not the main "app" settings record, which stops being written the moment
    // sessionOnly turns on.
    return DB.loadPreference().then(function(pref){
      var sessionOnlyPref = !!(pref && pref.sessionOnly === true);
      if (sessionOnlyPref){
        // Session-only was left ON: start every collection empty in memory. Do NOT read employees/
        // projects/demands/assignments/mentorships/skills from IndexedDB, and do NOT touch or wipe
        // whatever is already sitting there - no silent destructive purge, just don't load it.
        state.employees = []; state.projects = []; state.demands = [];
        state.assignments = []; state.mentorships = []; state.skills = [];
        state.employeeSkills = []; state.customFieldDefs = [];
        state.settings = U.clone(C.DEFAULT_SETTINGS);
        state.settings.sessionOnly = true;
        if (pref.theme) state.settings.theme = pref.theme;
        hydrated = false; // real IndexedDB data (if any) was deliberately not read into memory
        markDirty(); notify();
        return { empty: true, sessionOnly: true };
      }
      return Promise.all([
        DB.readAll("employees"), DB.readAll("projects"), DB.readAll("demands"),
        DB.readAll("assignments"), DB.readAll("mentorships"), DB.readAll("skills"),
        DB.readAll("employeeSkills"), DB.readAll("customFieldDefs"),
        DB.getRecord("settings", "app"), DB.getRecord("meta", "schemaVersion")
      ]).then(function(results){
        var employees=results[0], projects=results[1], demands=results[2], assignments=results[3],
            mentorships=results[4], skills=results[5], employeeSkills=results[6], customFieldDefs=results[7],
            settingsRec=results[8], metaRec=results[9];
        var empty = employees.length === 0 && projects.length === 0 && !settingsRec;
        state.employees = employees; state.projects = projects; state.demands = demands;
        state.assignments = assignments; state.mentorships = mentorships; state.skills = skills;
        state.employeeSkills = employeeSkills; state.customFieldDefs = customFieldDefs || [];
        state.settings = settingsRec ? Object.assign(U.clone(C.DEFAULT_SETTINGS), settingsRec) : U.clone(C.DEFAULT_SETTINGS);
        state.settings.sessionOnly = false;
        if (pref && pref.theme) state.settings.theme = pref.theme;
        hydrated = true; // in-memory state now genuinely reflects IndexedDB - safe to write again
        markDirty(); notify();
        // Migration ladder (BUILD_PLAN.md §2.6 / addendum "Migration"): the customFieldDefs store
        // itself is already created by ROE.db's onupgradeneeded regardless of the stored
        // meta.schemaVersion below, so this only needs to run any additional data-shaping steps and
        // then record the new version - it runs at most once per install, the next load() will see
        // metaRec.schemaVersion already at C.SCHEMA_VERSION and skip it.
        var storedVersion = metaRec ? metaRec.schemaVersion : undefined;
        if (empty || storedVersion === C.SCHEMA_VERSION){
          return { empty: empty };
        }
        return DB.runMigrationLadder(storedVersion || 0).then(function(){
          return DB.putRecord("meta", { schemaVersion: C.SCHEMA_VERSION }, "schemaVersion");
        }).then(function(){
          return { empty: empty, migrated: true, migratedFrom: storedVersion || 0 };
        });
      });
    }).catch(function(err){
      console.error("ROE.store load failed, falling back to session-only mode", err);
      state.settings.sessionOnly = true;
      hydrated = false;
      markDirty(); notify();
      return { fellBackToSessionOnly: true, empty: true };
    });
  }

  function loadDemoData(){
    var demo = ROE.demo.build();
    state.employees = demo.employees;
    state.skills = demo.skills;
    state.employeeSkills = demo.employeeSkills;
    state.projects = demo.projects;
    state.demands = demo.demands;
    state.assignments = demo.assignments;
    state.mentorships = demo.mentorships;
    // Adopt the demo's horizon/weights/thresholds, but never clobber the user's own
    // session-only choice or theme - loading demo data is not a settings reset.
    var sessionOnly = state.settings.sessionOnly;
    var theme = state.settings.theme;
    state.settings = Object.assign(U.clone(state.settings), demo.settings, { sessionOnly: sessionOnly, theme: theme });
    markDirty(); notify(); scheduleSave();
  }

  function clearAll(){
    // Full clean-slate reset per §9 ("leaves every object store empty"): every collection AND every
    // settings/preference value - including sessionOnly and theme - reverts to defaults. Nothing is
    // re-written to any store after the wipe, including the out-of-band preference record.
    state.employees = []; state.skills = []; state.employeeSkills = [];
    state.projects = []; state.demands = []; state.assignments = []; state.mentorships = [];
    state.customFieldDefs = [];
    state.settings = U.clone(C.DEFAULT_SETTINGS);
    lastPulledSnapshots = {};
    // In-memory state now genuinely matches the (empty) disk state, so it's safe to resume writes.
    hydrated = true;
    markDirty(); notify();
    if (DB.isAvailable()){
      return DB.clearAll();
    }
    return Promise.resolve();
  }

  // Reload-gated: writes {sessionOnly, theme} through the dedicated out-of-band preference path
  // (see ROE.db.savePreference), which only takes effect on the NEXT load(). Deliberately does NOT
  // touch `hydrated` and does NOT call scheduleSave()/persist() in either direction - toggling this
  // checkbox must never itself cause a write of current in-memory state to disk, whether turning
  // session-only on or off. That is what keeps `hydrated` (the actual write-gate) and
  // `state.settings.sessionOnly` (the checkbox's displayed/pending value) free to disagree for the
  // rest of the session without ever causing a behavior change - the fix for the round-2 data-loss
  // bugs. Real behavior (and the session badge, see isPersistenceActive()) only changes after an
  // actual reload re-runs load() and re-derives `hydrated` from the now-current preference.
  function setSessionOnly(on){
    state.settings.sessionOnly = !!on;
    markDirty(); notify();
    if (DB.isAvailable()){
      DB.savePreference({ sessionOnly: state.settings.sessionOnly, theme: state.settings.theme })
        .catch(function(err){ console.error("ROE.store: failed to save session-only preference", err); });
    }
  }

  // True precisely when writes are ACTUALLY active right now (i.e. what scheduleSave/persist will
  // do), as opposed to `state.settings.sessionOnly`, which may just be a pending preference that
  // will only take effect after the user reloads. Used to drive the session badge so it can never
  // claim a write-state that isn't real.
  function isPersistenceActive(){ return hydrated; }

  // ---- Generic CRUD over a top-level collection (employees/projects/demands/assignments/mentorships/skills) ----
  // Workbook re-import must never silently erase an existing record's custom-field values for a
  // key that simply has no column in the file being imported (see BUILD_PLAN_ADDENDUM_1.md's
  // "never silently delete data" principle - the same protection CF-2 already gives field-def
  // removal, applied here to the re-import path). ROE.io.parseSheet marks exactly which custom
  // keys had a column present in the row via a `__importedCustomKeys` array on the record (every
  // other write path - manual edit forms, API pull - never sets this marker, so they keep today's
  // plain full-record-replace behavior unchanged).
  function upsert(collectionName, record){
    var arr = state[collectionName];
    var idx = arr.findIndex(function(r){ return r.id === record.id; });
    var importedKeys = record.__importedCustomKeys;
    if (importedKeys){
      delete record.__importedCustomKeys;
      var existing = idx !== -1 ? arr[idx] : null;
      var merged = Object.assign({}, existing && existing.custom);
      importedKeys.forEach(function(key){
        if (record.custom && Object.prototype.hasOwnProperty.call(record.custom, key)){
          merged[key] = record.custom[key];
        } else {
          delete merged[key]; // column present in the file, but this row's cell was blank - explicit clear
        }
      });
      if (Object.keys(merged).length) record.custom = merged; else delete record.custom;
    }
    record.updatedAt = U.nowIso();
    if (idx === -1) arr.push(record); else arr[idx] = record;
    markDirty(); notify(); scheduleSave();
    return record;
  }

  function remove(collectionName, id){
    state[collectionName] = state[collectionName].filter(function(r){ return r.id !== id; });
    markDirty(); notify(); scheduleSave();
  }

  function upsertEmployeeSkill(rec){
    var idx = state.employeeSkills.findIndex(function(r){ return r.employeeId === rec.employeeId && r.skillId === rec.skillId; });
    if (idx === -1) state.employeeSkills.push(rec); else state.employeeSkills[idx] = rec;
    markDirty(); notify(); scheduleSave();
  }

  function setSettings(patch){
    state.settings = Object.assign({}, state.settings, patch);
    markDirty(); notify(); scheduleSave();
  }

  function setWeightPreset(name, weights){
    var presets = state.settings.presets.slice();
    var idx = presets.findIndex(function(p){ return p.name === name; });
    var rec = { name: name, weights: weights };
    if (idx === -1) presets.push(rec); else presets[idx] = rec;
    setSettings({ presets: presets });
  }

  function getLastPulledSnapshot(entityName){ return lastPulledSnapshots[entityName] || {}; }
  function setLastPulledSnapshot(entityName, byId){ lastPulledSnapshots[entityName] = byId; }

  // ---- Custom field defs (BUILD_PLAN_ADDENDUM_1.md CF-1/CF-2) ----
  // Not routed through the generic upsert() above: CustomFieldDef has no `updatedAt` in its schema
  // (just `createdAt`), and key generation/uniqueness needs ROE.model's pure helpers.
  function listFieldDefs(entityType){ return ROE.model.listFieldDefs(state.customFieldDefs, entityType); }
  function addFieldDef(entityType, label, type){
    state.customFieldDefs = ROE.model.addFieldDef(state.customFieldDefs, entityType, label, type);
    markDirty(); notify(); scheduleSave();
    return state.customFieldDefs[state.customFieldDefs.length - 1];
  }
  // Removes a field def by id. Per CF-2, values already stored under its key in existing records
  // are never touched here - they simply stop being shown/editable once the def is gone.
  function removeFieldDef(id){
    state.customFieldDefs = ROE.model.removeFieldDef(state.customFieldDefs, id);
    markDirty(); notify(); scheduleSave();
  }
  // Used by workbook import (IO-1): recreates any defs found in an imported file's CustomFieldDefs
  // sheet that don't already exist locally (matched by entityType+key), preserving their exact key
  // (never regenerated from the label) so already-encoded record.custom[key] values keep matching.
  // Never removes a local def just because the file doesn't list it.
  function restoreFieldDefs(list){
    (list || []).forEach(function(fd){
      var exists = state.customFieldDefs.some(function(d){ return d.entityType === fd.entityType && d.key === fd.key; });
      if (exists) return;
      state.customFieldDefs = state.customFieldDefs.concat([ROE.model.newCustomFieldDef({ entityType: fd.entityType, key: fd.key, label: fd.label, type: fd.type })]);
    });
    markDirty(); notify(); scheduleSave();
  }

  return {
    getState: getState, subscribe: subscribe, getIndexes: getIndexes, markDirty: markDirty,
    load: load, persist: persist, scheduleSave: scheduleSave,
    loadDemoData: loadDemoData, clearAll: clearAll, setSessionOnly: setSessionOnly,
    isPersistenceActive: isPersistenceActive,
    upsert: upsert, remove: remove, upsertEmployeeSkill: upsertEmployeeSkill,
    listFieldDefs: listFieldDefs, addFieldDef: addFieldDef, removeFieldDef: removeFieldDef, restoreFieldDefs: restoreFieldDefs,
    setSettings: setSettings, setWeightPreset: setWeightPreset,
    getLastPulledSnapshot: getLastPulledSnapshot, setLastPulledSnapshot: setLastPulledSnapshot,
    whitelistSettings: whitelistSettings
  };
})();

/* ===================== BLOCK 12: ROE.ui ===================== */
/* Impure: render functions per panel, event wiring, bootstrap. The only block allowed to touch document/window UI APIs. */
ROE.ui = (function(){
  var C = ROE.const, U = ROE.util, STORE = ROE.store, CALC = ROE.calc, SCORE = ROE.score, ALERTS = ROE.alerts, MENTOR = ROE.mentor, IO = ROE.io, API = ROE.api, MODEL = ROE.model;

  var PANELS = ["overview","skills","projects","optimizer","mentorship","timeline","alerts","settings"];

  // API connector: the 5 entities exposed in settings.api.entities (§6), their display labels, the
  // record factory used to normalize a freshly-pulled remote record on Apply, and a short list of
  // canonical field names offered as suggestions in the field-mapping editor.
  var API_ENTITIES = [
    { name:"employees",   label:"Employees",   factory:function(p){ return MODEL.newEmployee(p); },
      fields:["name","email","level","discipline","office","businessGroup","targetUtil","mentorRole","active","notes"] },
    { name:"projects",    label:"Projects",    factory:function(p){ return MODEL.newProject(p); },
      fields:["name","client","market","discipline","phase","budget","bimLevel","teamMin","teamMax","priority","status","notes"] },
    { name:"demands",     label:"Demands",     factory:function(p){ return MODEL.newDemand(p); },
      fields:["projectId","title","discipline","minLevel","openings"] },
    { name:"assignments", label:"Assignments", factory:function(p){ return MODEL.newAssignment(p); },
      fields:["projectId","employeeId","demandId","status","source"] },
    { name:"skills",      label:"Skills",      factory:function(p){ return MODEL.newSkill(p); },
      fields:["code","name","category"] }
  ];

  var uiState = {
    panel: "overview",
    skills: { page:1, pageSize:100, sortKey:"name", sortDir:"asc", filters:{ discipline:"", office:"", businessGroup:"", minLevel:"", skillId:"", skillMin:"" } },
    projects: { openProjectId: null },
    optimizer: { projectId:null, demandId:"", weights:{ skill:35, availability:30, seniority:15, discipline:20 }, autoStaffPreview:null },
    timeline: { mode:"employee" },
    alerts: { severity:"", rule:"", text:"", results:null },
    importSession: { mappings:{}, sheets:null, parsed:null },
    api: { pullPreview:null, pushPreview:null }
  };

  // ---------- small DOM helpers ----------
  function $(sel, root){ return (root||document).querySelector(sel); }
  function $all(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
  function h(html){ var t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
  function esc(s){ return String(s === undefined || s === null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

  function toast(msg){
    var region = $("#toast-region");
    var t = h('<div class="toast" role="status">' + esc(msg) + "</div>");
    region.appendChild(t);
    setTimeout(function(){ t.remove(); }, 4000);
  }

  function openModal(innerHtml, onMount){
    var root = $("#modal-root");
    root.innerHTML = '<div class="modal-overlay"><div class="modal" role="dialog" aria-modal="true">' + innerHtml + "</div></div>";
    var overlay = $(".modal-overlay", root);
    overlay.addEventListener("click", function(e){ if (e.target === overlay) closeModal(); });
    document.addEventListener("keydown", modalEscHandler);
    if (onMount) onMount($(".modal", root));
  }
  function modalEscHandler(e){ if (e.key === "Escape") closeModal(); }
  function closeModal(){
    $("#modal-root").innerHTML = "";
    document.removeEventListener("keydown", modalEscHandler);
  }

  function downloadText(filename, content, mime){
    var blob = new Blob([content], { type: mime || "text/plain" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function vendorsOk(){ return { chart: !!window.Chart, xlsx: !!window.XLSX }; }

  function updateVendorBanner(){
    var v = vendorsOk();
    var banner = $("#vendor-banner");
    if (v.chart && v.xlsx){ banner.style.display = "none"; return; }
    var missing = [];
    if (!v.chart) missing.push("Chart.js (charts disabled)");
    if (!v.xlsx) missing.push("SheetJS/xlsx (import/export/templates disabled)");
    banner.className = "banner";
    banner.style.display = "block";
    banner.innerHTML = "<strong>Some optional libraries failed to load from the CDN:</strong> " + esc(missing.join(", ")) +
      ". Everything else still works. See About in Data &amp; Settings for details.";

  // ---------- routing ----------
  function navigate(panel){

    $all(".panel").forEach(function(p){ p.classList.remove("active"); });
    var target = $("#panel-" + panel);
    target.classList.add("active");
    renderPanel(panel);
  }

  function renderPanel(panel){
    if (panel === "overview") renderOverview();
    else if (panel === "skills") renderSkills();
    else if (panel === "projects") renderProjects();
    else if (panel === "optimizer") renderOptimizer();
    else if (panel === "mentorship") renderMentorship();
    else if (panel === "timeline") renderTimeline();
    else if (panel === "alerts") renderAlerts();
    else if (panel === "settings") renderSettings();
  }

  function renderAll(){ renderPanel(uiState.panel); updateSessionBadge(); }

  function updateSessionBadge(){
    // Bound to isPersistenceActive() (i.e. `hydrated`, the actual write-gate), NOT the raw
    // settings.sessionOnly checkbox value - a pending, not-yet-reloaded toggle must never change
    // what the badge claims is happening right now.
    var badge = $("#session-badge");
    var writing = STORE.isPersistenceActive();
    badge.classList.toggle("visible", !writing);
  }

  /* =========================== OVERVIEW =========================== */
  function renderOverview(){
    var state = STORE.getState();
    var root = $("#panel-overview");
    if (state.employees.length === 0){
      root.innerHTML = '<div class="empty-state">No data yet. Click <strong>Load demo data</strong> in the top bar to get started, or import a workbook from Data &amp; Settings.</div>';
      return;
    }
    var idx = STORE.getIndexes();
    var months = U.monthKeys(state.settings.horizonStart, state.settings.horizonMonths);
    var currentMonth = months[0];
    var activeEmployees = state.employees.filter(function(e){ return e.active; });
    var activeProjects = state.projects.filter(function(p){ return p.status === "Active"; });

    var utils = activeEmployees.map(function(e){ return CALC.committed(e.id, currentMonth, idx); });
    var meanUtil = Math.round(U.mean(utils));
    var overCount = activeEmployees.filter(function(e){ return CALC.committed(e.id, currentMonth, idx) > state.settings.alertThresholds.overallocPct; }).length;

    var unstaffedFte = 0;
    state.demands.forEach(function(d){
      months.forEach(function(m){
        var need = (d.allocationByMonth[m]||0) * (d.openings||1);
        var fillPct = CALC.demandFillPct(d.id, m, idx);
        unstaffedFte += need * Math.max(0, (100-fillPct))/100;
      });
    });
    unstaffedFte = Math.round(unstaffedFte / 100); // FTE-months, rough KPI

    var alerts = ALERTS.scan(state, state.settings.alertThresholds);
    var bySev = { CRITICAL:0, HIGH:0, MEDIUM:0, LOW:0 };
    alerts.forEach(function(a){ bySev[a.severity] = (bySev[a.severity]||0) + 1; });

    var scorecardRows = activeEmployees.slice(0, 200).map(function(e){
      var c = CALC.committed(e.id, currentMonth, idx);
      var status = c > state.settings.alertThresholds.overallocPct ? "Over" : (c < e.targetUtil - state.settings.alertThresholds.benchGapPct ? "Bench" : "On target");
      return "<tr><td>"+esc(e.name)+"</td><td>"+e.targetUtil+"%</td><td>"+Math.round(c)+"%</td><td>"+status+"</td></tr>";
    }).join("");

    root.innerHTML =
      '<div class="kpi-row">' +
        kpi(activeEmployees.length, "Headcount") +
        kpi(activeProjects.length, "Active projects") +
        kpi(meanUtil + "%", "Mean utilization (" + currentMonth + ")") +
        kpi(overCount, "Over-allocated now") +
        kpi(unstaffedFte, "Unstaffed demand (FTE-months)") +
        kpi(alerts.length, "Open alerts (C:"+bySev.CRITICAL+" H:"+bySev.HIGH+" M:"+bySev.MEDIUM+" L:"+bySev.LOW+")") +
      '</div>' +

      '<div class="card"><h2>Utilization vs. target</h2><table><thead><tr><th>Employee</th><th>Target</th><th>Committed</th><th>Status</th></tr></thead><tbody>' + scorecardRows + '</tbody></table></div>';

    if (window.Chart){
      var ctx = $("#chart-overview").getContext("2d");
      var series = months.map(function(m){ return U.mean(activeEmployees.map(function(e){ return CALC.committed(e.id, m, idx); })); });

      root._chart = new Chart(ctx, {
        type: "line",
        data: { labels: months, datasets: [{ label:"Mean utilization %", data: series, borderColor:"#4f8cff", backgroundColor:"rgba(79,140,255,.15)", fill:true, tension:.25 }] },
        options: { responsive:true, plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true } } }
      });

  function kpi(val, label){
    return '<div class="kpi-tile"><div class="val">'+esc(val)+'</div><div class="lbl">'+esc(label)+'</div></div>';

  /* =========================== SKILLS MATRIX =========================== */
  function renderSkills(){
    var state = STORE.getState();
    var root = $("#panel-skills");
    var f = uiState.skills.filters;

    var filtered = state.employees.filter(function(e){
      if (f.discipline && e.discipline !== f.discipline) return false;
      if (f.office && e.office !== f.office) return false;
      if (f.businessGroup && e.businessGroup !== f.businessGroup) return false;
      if (f.minLevel && C.EMP_LEVEL_ORD[e.level] < C.EMP_LEVEL_ORD[f.minLevel]) return false;
      if (f.skillId && f.skillMin !== ""){
        var es = state.employeeSkills.find(function(x){ return x.employeeId===e.id && x.skillId===f.skillId; });
        var lvl = es ? es.level : 0;
        if (lvl < parseInt(f.skillMin,10)) return false;
      }
      return true;
    });

    var sk = uiState.skills.sortKey, dir = uiState.skills.sortDir === "asc" ? 1 : -1;
    filtered.sort(function(a,b){
      var av = a[sk], bv = b[sk];
      if (av === undefined) av = "";
      if (bv === undefined) bv = "";
      if (av < bv) return -1*dir; if (av > bv) return 1*dir; return 0;
    });

    var pageSize = uiState.skills.pageSize;
    var totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
    if (uiState.skills.page > totalPages) uiState.skills.page = totalPages;
    var pageItems = filtered.slice((uiState.skills.page-1)*pageSize, uiState.skills.page*pageSize);

    var offices = Array.from(new Set(state.employees.map(function(e){ return e.office; }))).filter(Boolean).sort();

    function levelColor(lvl){
      var colors = ["#1b2028","#243244","#1f4a5c","#1f6b4e","#4f8f2a","#c9a227"];
      return colors[lvl] || colors[0];
    }

    // NEW-2: EmployeeSkill rows are never cascade-deleted when their referenced Skill is removed
    // from the catalog (countSkillReferences/the delete-skill confirm dialog promise this). Those
    // orphaned rows would otherwise just vanish from the matrix (state.skills no longer has a
    // matching column), leaving the data present-but-invisible. Add one extra "Unknown skill"
    // column per orphaned skillId still referenced by any EmployeeSkill row, so the confirm
    // dialog's promise ("rendered as Unknown skill, not removed") is actually true somewhere a
    // user can see it.
    var orphanSkillIds = Array.from(new Set(state.employeeSkills.map(function(es){ return es.skillId; })))
      .filter(function(sid){ return !state.skills.some(function(s){ return s.id === sid; }); });

    var skillCols = state.skills.map(function(s){ return '<th>'+esc(s.code)+'</th>'; }).join("") +
      orphanSkillIds.map(function(sid){ return '<th>'+esc("Unknown skill (" + sid + ")")+'</th>'; }).join("");
    var rows = pageItems.map(function(e){
      var skillCells = state.skills.map(function(s){
        var es = state.employeeSkills.find(function(x){ return x.employeeId===e.id && x.skillId===s.id; });
        var lvl = es ? es.level : 0;
        return '<td style="background:'+levelColor(lvl)+';text-align:center;" data-skill-cell data-emp="'+e.id+'" data-skill="'+s.id+'">'+
          '<input type="number" min="0" max="5" value="'+lvl+'" aria-label="'+esc(e.name)+' '+esc(s.code)+' skill level" style="width:44px;" data-emp="'+e.id+'" data-skill="'+s.id+'" class="skill-level-input"></td>';
      }).join("");
      var orphanCells = orphanSkillIds.map(function(sid){
        var es = state.employeeSkills.find(function(x){ return x.employeeId===e.id && x.skillId===sid; });
        if (!es) return '<td style="text-align:center;">-</td>';
        return '<td style="background:'+levelColor(es.level)+';text-align:center;" title="Unknown skill (' + esc(sid) + ')">'+es.level+'</td>';
      }).join("");
      return '<tr><td>'+esc(e.name)+'</td><td>'+esc(e.level)+'</td><td>'+esc(e.discipline)+'</td><td>'+esc(e.office)+'</td><td>'+esc(e.businessGroup)+'</td>'+skillCells+orphanCells+
        '<td><button type="button" class="edit-emp" data-id="'+e.id+'">Edit</button></td></tr>';
    }).join("");

    root.innerHTML =
      '<div class="card">' +
        '<div class="toolbar">' +
          fieldSelect("f-discipline","Discipline", [""].concat(C.DISCIPLINES), f.discipline) +
          fieldSelect("f-office","Office", [""].concat(offices), f.office) +
          fieldSelect("f-bg","Business group", [""].concat(C.BUSINESS_GROUPS), f.businessGroup) +
          fieldSelect("f-minlevel","Min level", [""].concat(C.EMP_LEVELS), f.minLevel) +
          fieldSelect("f-skill","Skill", [""].concat(state.skills.map(function(s){return s.id+"::"+s.code;})), f.skillId ? f.skillId+"::"+(state.skills.find(function(s){return s.id===f.skillId;})||{}).code : "", true) +
          fieldNumber("f-skillmin","Min skill level", f.skillMin, 0, 5) +
          '<button type="button" id="btn-add-employee" class="primary">Add employee</button>' +
          '<button type="button" id="btn-manage-emp-fields">Manage employee fields</button>' +
        '</div>' +
        '<table><thead><tr>' +
          sortTh("Name","name") + sortTh("Level","level") + sortTh("Discipline","discipline") + sortTh("Office","office") + sortTh("Business group","businessGroup") +
          skillCols + '<th>Actions</th>' +
        '</tr></thead><tbody>' + (rows || '<tr><td colspan="99">No employees match the current filters.</td></tr>') + '</tbody></table>' +
        pagination(uiState.skills.page, totalPages, filtered.length) +
      '</div>' +
      renderSkillsCatalogCard(state);

    // wiring
    $("#f-discipline", root).onchange = function(){ f.discipline = this.value; uiState.skills.page=1; renderSkills(); };
    $("#f-office", root).onchange = function(){ f.office = this.value; uiState.skills.page=1; renderSkills(); };
    $("#f-bg", root).onchange = function(){ f.businessGroup = this.value; uiState.skills.page=1; renderSkills(); };
    $("#f-minlevel", root).onchange = function(){ f.minLevel = this.value; uiState.skills.page=1; renderSkills(); };
    $("#f-skill", root).onchange = function(){ f.skillId = this.value ? this.value.split("::")[0] : ""; uiState.skills.page=1; renderSkills(); };
    $("#f-skillmin", root).onchange = function(){ f.skillMin = this.value; uiState.skills.page=1; renderSkills(); };
    $("#btn-add-employee", root).onclick = function(){ openEmployeeModal(null); };
    $("#btn-manage-emp-fields", root).onclick = function(){ openManageFieldsModal("Employee", renderSkills); };
    wireSkillsCatalogCard(root);
    $all("th[data-sort]", root).forEach(function(th){
      th.onclick = function(){
        var k = th.dataset.sort;
        if (uiState.skills.sortKey === k) uiState.skills.sortDir = uiState.skills.sortDir === "asc" ? "desc" : "asc";
        else { uiState.skills.sortKey = k; uiState.skills.sortDir = "asc"; }
        renderSkills();
      };
    });
    $all(".edit-emp", root).forEach(function(btn){ btn.onclick = function(){ openEmployeeModal(btn.dataset.id); }; });
    $all(".skill-level-input", root).forEach(function(inp){
      inp.onchange = function(){
        var lvl = U.clamp(parseInt(this.value,10)||0, 0, 5);
        STORE.upsertEmployeeSkill(ROE.model.newEmployeeSkill({ employeeId: this.dataset.emp, skillId: this.dataset.skill, level: lvl }));
        toast("Skill level updated");
      };
    });
    $all(".page-btn", root).forEach(function(btn){
      btn.onclick = function(){ uiState.skills.page = parseInt(btn.dataset.page,10); renderSkills(); };
    });
  }

  function sortTh(label, key){
    var active = uiState.skills.sortKey === key;
    return '<th data-sort="'+key+'" style="cursor:pointer;">'+esc(label)+(active ? (uiState.skills.sortDir==="asc"?" ▲":" ▼") : "")+'</th>';
  }
  function fieldSelect(id, label, options, value){
    var opts = options.map(function(o){
      var v = o, l = o;
      if (typeof o === "string" && o.indexOf("::") !== -1){ v = o.split("::")[0]; l = o.split("::")[1]; }
      var sel = (v === value || (typeof value === "string" && value.split("::")[0] === v)) ? " selected" : "";
      return '<option value="'+esc(v)+'"'+sel+'>'+esc(l || "(all)")+'</option>';
    }).join("");
    return '<label>'+esc(label)+'<select id="'+id+'">'+opts+'</select></label>';
  }
  function fieldNumber(id, label, value, min, max){
    return '<label>'+esc(label)+'<input type="number" id="'+id+'" value="'+esc(value)+'" min="'+min+'" max="'+max+'"></label>';
  }
  function pagination(page, totalPages, total){
    if (totalPages <= 1) return '<div class="pagination hint">'+total+' record(s)</div>';
    var btns = "";
    for (var i=1;i<=totalPages;i++) btns += '<button type="button" class="page-btn" data-page="'+i+'" '+(i===page?'disabled':'')+'>'+i+'</button>';
    return '<div class="pagination">'+btns+'<span class="hint">'+total+' record(s)</span></div>';
  }

  /* =========================== SKILLS CATALOG (NEW-2: manual Skill CRUD) =========================== */
  // Counts how many EmployeeSkill rows and Demand.requiredSkills entries reference `skillId`, used
  // to warn (with a count) before a delete - deletion proceeds only on confirm, and never
  // cascade-deletes those references (they render as "Unknown skill" afterward instead).
  function countSkillReferences(state, skillId){
    var empRefs = state.employeeSkills.filter(function(es){ return es.skillId === skillId; }).length;
    var demandRefs = 0;
    state.demands.forEach(function(d){
      (d.requiredSkills||[]).forEach(function(rs){ if (rs.skillId === skillId) demandRefs += 1; });
    });
    return empRefs + demandRefs;
  }

  function renderSkillsCatalogCard(state){
    var rows = state.skills.map(function(s){
      var refCount = countSkillReferences(state, s.id);
      return '<tr><td>'+esc(s.code)+'</td><td>'+esc(s.name)+'</td><td>'+esc(s.category)+'</td><td>'+refCount+'</td>' +
        '<td><button type="button" class="edit-skill" data-id="'+s.id+'">Edit</button> <button type="button" class="delete-skill danger" data-id="'+s.id+'">Delete</button></td></tr>';
    }).join("");
    return '<div class="card"><h2>Skills catalog</h2><div class="toolbar">' +
      '<button type="button" id="btn-add-skill" class="primary">Add skill</button>' +
      '<button type="button" id="btn-manage-skill-fields">Manage skill fields</button>' +
      '</div><table><thead><tr><th>Code</th><th>Name</th><th>Category</th><th># references</th><th>Actions</th></tr></thead>' +
      '<tbody>'+(rows||'<tr><td colspan="5">No skills yet.</td></tr>')+'</tbody></table></div>';
  }

  function wireSkillsCatalogCard(root){
    $("#btn-add-skill", root).onclick = function(){ openSkillModal(null); };
    $("#btn-manage-skill-fields", root).onclick = function(){ openManageFieldsModal("Skill", renderSkills); };
    $all(".edit-skill", root).forEach(function(btn){ btn.onclick = function(){ openSkillModal(btn.dataset.id); }; });
    $all(".delete-skill", root).forEach(function(btn){
      btn.onclick = function(){
        var state = STORE.getState();
        var refCount = countSkillReferences(state, btn.dataset.id);
        var msg = refCount > 0
          ? ("This skill is referenced by " + refCount + " employee skill / required-skill record(s). Deleting it will leave those references as \"Unknown skill\" rather than removing them. Continue?")
          : "Delete this skill?";
        if (!confirm(msg)) return;
        STORE.remove("skills", btn.dataset.id);
        renderSkills();
        toast("Skill deleted");
      };
    });
  }

  function field(name,label,type,value){

  function selectRow(name,label,options,value){
    return '<label>'+esc(label)+'<select id="m-'+name+'">'+options.map(function(o){return '<option value="'+esc(o)+'" '+(o===value?'selected':'')+'>'+esc(o)+'</option>';}).join("")+'</select></label>';

  /* =========================== CUSTOM FIELDS (BUILD_PLAN_ADDENDUM_1.md CF-1..CF-4) =========================== */
  // Renders the current custom-field defs for `entityType` as extra form inputs (CF-3), reading
  // their current value out of `rec.custom[key]`. Returns "" (renders nothing) if there are no
  // defs for this entity type yet.
  // `extraAttrs` (optional, e.g. ' data-demand="dem_1"') disambiguates repeated per-record inputs
  // within a single modal (e.g. one custom-field block per demand card in the Project modal).
  function customFieldInputsHtml(entityType, rec, extraAttrs){
    extraAttrs = extraAttrs || "";
    var defs = ROE.model.listFieldDefs(STORE.getState().customFieldDefs, entityType);
    if (!defs.length) return "";
    var rows = defs.map(function(d){
      var val = (rec && rec.custom) ? rec.custom[d.key] : undefined;
      if (val === undefined || val === null) val = "";
      var inputType = d.type === "number" ? "number" : "text";
      return '<label>'+esc(d.label)+' <span class="hint">('+d.type+', key: '+esc(d.key)+')</span><input type="'+inputType+'" class="custom-field-input" data-entity="'+esc(entityType)+'" data-key="'+esc(d.key)+'" data-type="'+d.type+'"'+extraAttrs+' value="'+esc(val)+'"></label>';
    }).join("");
    return '<fieldset><legend>Custom fields</legend><div class="row">'+rows+'</div></fieldset>';
  }

  // Validates the number-typed custom-field inputs currently in `root` for `entityType`.
  // Returns an array of human-readable error messages (empty = all good). Called before save so a
  // non-numeric entry in a Number field blocks the save with a clear message (CF-3).
  function validateCustomFieldInputsUI(root, entityType){
    var defs = ROE.model.listFieldDefs(STORE.getState().customFieldDefs, entityType);
    var errors = [];
    defs.forEach(function(d){
      if (d.type !== "number") return;
      var input = root.querySelector('.custom-field-input[data-entity="'+entityType+'"][data-key="'+d.key+'"]');
      if (!input) return;
      var raw = input.value;
      if (raw === "" || raw === undefined || raw === null) return;
      if (isNaN(parseFloat(raw))) errors.push("'" + d.label + "' must be a number");
    });
    return errors;
  }

  // Reads the current custom-field inputs in `root` for `entityType` into a fresh `custom` object,
  // starting from `existingCustom` so that values stored under a key whose def has since been
  // removed (and therefore has no input in this form) are preserved untouched (CF-2). A field left
  // blank in the form is deleted from the result rather than stored as "" (CF-3).
  function readCustomFieldValues(root, entityType, existingCustom){
    var defs = ROE.model.listFieldDefs(STORE.getState().customFieldDefs, entityType);
    var custom = Object.assign({}, existingCustom || {});
    defs.forEach(function(d){
      var input = root.querySelector('.custom-field-input[data-entity="'+entityType+'"][data-key="'+d.key+'"]');
      if (!input) return;
      var raw = input.value;
      if (raw === "" || raw === undefined || raw === null){ delete custom[d.key]; return; }
      custom[d.key] = d.type === "number" ? parseFloat(raw) : raw;
    });
    return custom;
  }

  // Reusable "Manage fields" modal (CF-2): add a field (label + type; key is generated from the
  // label and shown read-only), remove a field. Removing never deletes stored values, it only
  // stops them from being shown here or in the entity's form going forward.
  function openManageFieldsModal(entityType, onChange){
    function render(){
      var defs = ROE.model.listFieldDefs(STORE.getState().customFieldDefs, entityType);
      var rows = defs.map(function(d){
        return '<tr><td>'+esc(d.label)+'</td><td class="mono">'+esc(d.key)+'</td><td>'+esc(d.type)+'</td>'+
          '<td><button type="button" class="mf-remove" data-id="'+d.id+'">Remove</button></td></tr>';
      }).join("");
      return '<h2>Manage custom fields - '+esc(entityType)+'</h2>'+
        '<table><thead><tr><th>Label</th><th>Key</th><th>Type</th><th>Actions</th></tr></thead><tbody>'+
        (rows || '<tr><td colspan="4">No custom fields yet.</td></tr>')+'</tbody></table>'+
        '<div class="row"><label>New field label<input type="text" id="mf-label"></label>'+
        selectRow("mf-type","Type",C.CUSTOM_FIELD_TYPES,"text")+
        '<button type="button" id="mf-add" class="primary">Add field</button></div>'+
        '<p class="hint">Removing a field never deletes values already stored under it in existing records - it just stops showing/editing them here.</p>'+
        '<div class="row" style="justify-content:flex-end;"><button type="button" id="mf-close">Close</button></div>';
    }
    function wire(modal){
      $("#mf-close", modal).onclick = function(){ closeModal(); if (onChange) onChange(); };
      $("#mf-add", modal).onclick = function(){
        var label = $("#mf-label", modal).value.trim();
        if (!label){ toast("Enter a label"); return; }
        var type = $("#m-mf-type", modal).value;
        STORE.addFieldDef(entityType, label, type || "text");
        modal.innerHTML = render();
        wire(modal);
        toast("Field added");

  // NEW-2: the demand editor's required-skills input only ever showed the raw SKILLID:minLevel:weight
  // encoding, never a resolved skill name, so a Demand.requiredSkills row referencing a deleted
  // Skill just showed a dangling ID (indistinguishable from a valid one). Resolve each entry's
  // skill name here, falling back to "Unknown skill (ID)" when the catalog no longer has it.
  function resolvedRequiredSkillsLabel(requiredSkills, skills){
    if (!requiredSkills || !requiredSkills.length) return "(none)";
    return requiredSkills.map(function(rs){
      var skl = (skills || []).find(function(s){ return s.id === rs.skillId; });
      var name = skl ? (skl.code || skl.name) : ("Unknown skill (" + rs.skillId + ")");
      return name + " (min " + rs.minLevel + ", weight " + rs.weight + ")";
    }).join(", ");
  }

  function wireDemandsEditor(modal, projectId){
    var editor = $("#demands-editor", modal);
    if (!editor) return;
    $("#btn-add-demand", editor).onclick = function(){
      var d = ROE.model.newDemand({ projectId: projectId, title: "New demand", allocationByMonth: {} });
      STORE.upsert("demands", d);
      openProjectModal(projectId);
    };
    $("#btn-manage-demand-fields", editor).onclick = function(){ openManageFieldsModal("Demand", function(){ openProjectModal(projectId); }); };
    $all('.custom-field-input[data-entity="Demand"]', editor).forEach(function(inp){
      inp.onchange = function(){
        var d = STORE.getState().demands.find(function(x){ return x.id === inp.dataset.demand; });
        if (!d) return;
        var key = inp.dataset.key, type = inp.dataset.type, raw = inp.value;
        var custom = Object.assign({}, d.custom || {});
        if (raw === ""){ delete custom[key]; }
        else if (type === "number"){
          var n = parseFloat(raw);
          if (isNaN(n)){ toast("'" + key + "' must be a number"); return; }
          custom[key] = n;
        } else {
          custom[key] = raw;
        }
        if (Object.keys(custom).length === 0) delete d.custom; else d.custom = custom;
        STORE.upsert("demands", d);
      };
    });
    $all(".demand-month-input", editor).forEach(function(inp){
      inp.onchange = function(){
        var d = STORE.getState().demands.find(function(x){return x.id===this.dataset.demand;}.bind(this));
        if (!d) return;
        d.allocationByMonth[this.dataset.month] = U.clamp(parseInt(this.value,10)||0, 0, 100);
        STORE.upsert("demands", d);
      };
    });
    $all(".d-title", editor).forEach(function(inp){ inp.onchange = function(){ var d=STORE.getState().demands.find(function(x){return x.id===inp.dataset.id;}); d.title=inp.value; STORE.upsert("demands", d); }; });
    $all(".d-disc, .d-minlevel", editor).forEach(function(sel){ sel.onchange = function(){ var d=STORE.getState().demands.find(function(x){return x.id===sel.dataset.id;}); d[sel.dataset.field]=sel.value; STORE.upsert("demands", d); }; });
    $all(".d-openings", editor).forEach(function(inp){ inp.onchange = function(){ var d=STORE.getState().demands.find(function(x){return x.id===inp.dataset.id;}); d.openings=Math.max(1,parseInt(inp.value,10)||1); STORE.upsert("demands", d); }; });
    $all(".d-reqskills", editor).forEach(function(inp){ inp.onchange = function(){ var d=STORE.getState().demands.find(function(x){return x.id===inp.dataset.id;}); d.requiredSkills=IO.decodeRequiredSkills(inp.value); STORE.upsert("demands", d); toast("Required skills updated"); }; });
    $all(".d-remove", editor).forEach(function(btn){ btn.onclick = function(){ STORE.remove("demands", btn.dataset.id); openProjectModal(projectId); }; });
    $all(".fa-apply", editor).forEach(function(btn){
      btn.onclick = function(){
        var demandId = btn.dataset.id;
        var card = editor.querySelector('[data-demand-card="'+demandId+'"]');
        var start = card.querySelector(".fa-start").value.trim();
        var end = card.querySelector(".fa-end").value.trim();
        var val = U.clamp(parseInt(card.querySelector(".fa-val").value,10)||0, 0, 100);
        if (!U.isMonthKey(start) || !U.isMonthKey(end)){ toast("Enter valid YYYY-MM start/end months"); return; }
        var d = STORE.getState().demands.find(function(x){return x.id===demandId;});
        var months = U.monthKeys(STORE.getState().settings.horizonStart, STORE.getState().settings.horizonMonths);
        var si = months.indexOf(start), ei = months.indexOf(end);
        if (si === -1 || ei === -1 || ei < si){ toast("Range must be within the horizon and start <= end"); return; }
        for (var i=si;i<=ei;i++) d.allocationByMonth[months[i]] = val;
        STORE.upsert("demands", d);
        openProjectModal(projectId);
        toast("Applied " + val + "% across " + (ei-si+1) + " month(s)");
      };
    });
  }

  // NEW-1: project picker, employee picker, optional demand picker (filtered to this project's
  // demands), a per-month allocation grid reusing the same fill-across pattern as the Demand
  // editor, status, and custom fields. Warns (never blocks) if the manual allocation would push
  // the employee over effectiveCapacity in any month - same preview/warn philosophy used
  // elsewhere (optimizer/auto-staff) rather than silently blocking the save.
  function openAssignmentModal(defaultProjectId, assignmentId){
    var initial = STORE.getState();
    var asg = assignmentId ? initial.assignments.find(function(a){ return a.id === assignmentId; }) : ROE.model.newAssignment({ projectId: defaultProjectId, status: "Proposed" });
    var months = U.monthKeys(initial.settings.horizonStart, initial.settings.horizonMonths);

    function render(){
      var st = STORE.getState();
      var projectOptions = st.projects.map(function(p){ return '<option value="'+p.id+'" '+(p.id===asg.projectId?'selected':'')+'>'+esc(p.name)+'</option>'; }).join("");
      var employeeOptions = st.employees.map(function(e){ return '<option value="'+e.id+'" '+(e.id===asg.employeeId?'selected':'')+'>'+esc(e.name)+'</option>'; }).join("");
      var projectDemands = st.demands.filter(function(d){ return d.projectId === asg.projectId; });
      var demandOptions = '<option value="">(none)</option>' + projectDemands.map(function(d){ return '<option value="'+d.id+'" '+(d.id===asg.demandId?'selected':'')+'>'+esc(d.title)+'</option>'; }).join("");
      var monthCells = months.map(function(m){
        var v = asg.allocationByMonth[m] !== undefined ? asg.allocationByMonth[m] : "";
        return '<td><input type="number" min="0" max="100" style="width:56px;" value="'+v+'" data-month="'+m+'" class="asg-month-input" aria-label="Allocation '+m+'"></td>';
      }).join("");
      return '<h2>'+(assignmentId?'Edit':'Add')+' assignment</h2>' +
        '<div class="row">' +
          '<label>Project<select id="a-project">'+projectOptions+'</select></label>' +
          '<label>Employee<select id="a-employee">'+employeeOptions+'</select></label>' +
          '<label>Demand (optional)<select id="a-demand">'+demandOptions+'</select></label>' +
          selectRow("a-status","Status",C.ASSIGNMENT_STATUS,asg.status) +
        '</div>' +
        '<div class="hint">Fill-across: <input type="text" id="a-fa-start" placeholder="start YYYY-MM" style="width:100px;"> to ' +
        '<input type="text" id="a-fa-end" placeholder="end YYYY-MM" style="width:100px;"> value ' +
        '<input type="number" id="a-fa-val" min="0" max="100" style="width:60px;"> ' +
        '<button type="button" id="a-fa-apply">Apply range</button></div>' +
        '<div style="overflow-x:auto;"><table><thead><tr><th>Month</th>'+months.map(function(m){return '<th>'+m+'</th>';}).join("")+'</tr></thead>' +
        '<tbody><tr><td>Allocation %</td>'+monthCells+'</tr></tbody></table></div>' +
        customFieldInputsHtml("Assignment", asg) +
        '<div class="row" style="justify-content:flex-end;">' +
          '<button type="button" id="m-manage-fields">Manage fields</button>' +
          (assignmentId ? '<button type="button" id="m-delete" class="danger">Delete</button>' : '') +
          '<button type="button" id="m-cancel">Cancel</button><button type="button" id="m-save" class="primary">Save</button>' +
        '</div>';
    }

    function currentAllocFromForm(modal){
      var alloc = {};
      $all(".asg-month-input", modal).forEach(function(inp){
        var v = U.clamp(parseInt(inp.value,10)||0, 0, 100);
        if (v > 0) alloc[inp.dataset.month] = v;
      });
      return alloc;
    }

    function wire(modal){
      $("#m-cancel", modal).onclick = function(){ openProjectModal(defaultProjectId); };
      $("#m-manage-fields", modal).onclick = function(){ openManageFieldsModal("Assignment", function(){ openAssignmentModal(defaultProjectId, assignmentId); }); };
      $("#a-project", modal).onchange = function(){ asg.projectId = this.value; asg.demandId = null; modal.innerHTML = render(); wire(modal); };
      $("#a-fa-apply", modal).onclick = function(){
        var start = $("#a-fa-start", modal).value.trim();
        var end = $("#a-fa-end", modal).value.trim();
        var val = U.clamp(parseInt($("#a-fa-val", modal).value,10)||0, 0, 100);
        if (!U.isMonthKey(start) || !U.isMonthKey(end)){ toast("Enter valid YYYY-MM start/end months"); return; }
        var si = months.indexOf(start), ei = months.indexOf(end);
        if (si === -1 || ei === -1 || ei < si){ toast("Range must be within the horizon and start <= end"); return; }
        $all(".asg-month-input", modal).forEach(function(inp){
          var mi = months.indexOf(inp.dataset.month);
          if (mi >= si && mi <= ei) inp.value = val;
        });
      };
      if (assignmentId){
        $("#m-delete", modal).onclick = function(){
          if (!confirm("Delete this assignment?")) return;
          STORE.remove("assignments", assignmentId);
          openProjectModal(defaultProjectId);
          toast("Assignment deleted");
        };
      }
      $("#m-save", modal).onclick = function(){
        var cfErrors = validateCustomFieldInputsUI(modal, "Assignment");
        if (cfErrors.length){ toast("Fix errors: " + cfErrors.join("; ")); return; }
        var projectId = $("#a-project", modal).value;
        var employeeId = $("#a-employee", modal).value;
        var demandId = $("#a-demand", modal).value || null;
        var status = $("#m-a-status", modal).value;
        var alloc = currentAllocFromForm(modal);
        var rec = ROE.model.newAssignment({
          id: asg.id, projectId: projectId, employeeId: employeeId, demandId: demandId,
          allocationByMonth: alloc, status: status, source: assignmentId ? asg.source : "manual",
          scoreSnapshot: asg.scoreSnapshot,
          custom: readCustomFieldValues(modal, "Assignment", asg.custom)
        });
        var valid = ROE.model.validateAssignment(rec, STORE.getState().customFieldDefs);
        if (!valid.ok){ toast("Fix errors: " + valid.errors.map(function(e){return e.message;}).join("; ")); return; }
        if (!employeeId){ toast("Pick an employee"); return; }

        // Warn (never block) if this manual allocation would push the employee over
        // effectiveCapacity in any month - same preview/warn philosophy as the optimizer/
        // auto-staff, which never silently over-allocate but never hard-block a manual save.
        var st = STORE.getState();
        var otherAssignments = st.assignments.filter(function(a){ return a.id !== rec.id; });
        var idx = CALC.buildIndexes(Object.assign({}, st, { assignments: otherAssignments }));
        var emp = st.employees.find(function(e){ return e.id === employeeId; });
        var overMonths = [];
        if (emp){
          for (var m in alloc){
            var existing = CALC.committed(employeeId, m, idx);
            var cap = CALC.effectiveCapacity(emp, m, idx, st.settings);
            if (existing + alloc[m] > cap) overMonths.push(m + " (" + Math.round(existing + alloc[m]) + "% > " + Math.round(cap) + "% capacity)");
          }
        }

        STORE.upsert("assignments", rec);
        if (overMonths.length){
          toast("Saved, but this exceeds " + (emp?emp.name:"the employee") + "'s effective capacity in: " + overMonths.join(", "));
        } else {
          toast("Assignment saved");
        }
        openProjectModal(projectId);
      };
    }

    openModal(render(), wire);
  }

  /* =========================== OPTIMIZER =========================== */
  function renderOptimizer(){
    var state = STORE.getState();
    var root = $("#panel-optimizer");
    var os = uiState.optimizer;
    if (!os.projectId && state.projects.length) os.projectId = state.projects[0].id;
    var projectDemands = state.demands.filter(function(d){ return d.projectId === os.projectId; });
    if (os.demandId && !projectDemands.some(function(d){return d.id===os.demandId;})) os.demandId = "";

    var projectOptions = state.projects.map(function(p){ return '<option value="'+p.id+'" '+(p.id===os.projectId?'selected':'')+'>'+esc(p.name)+'</option>'; }).join("");
    var demandOptions = '<option value="">All open demands</option>' + projectDemands.map(function(d){ return '<option value="'+d.id+'" '+(d.id===os.demandId?'selected':'')+'>'+esc(d.title)+'</option>'; }).join("");

    var presetOptions = '<option value="">(none)</option>' + state.settings.presets.map(function(p){ return '<option value="'+esc(p.name)+'">'+esc(p.name)+'</option>'; }).join("");

    root.innerHTML =
      '<div class="card"><div class="toolbar">' +
        '<label>Project<select id="opt-project">'+projectOptions+'</select></label>' +
        '<label>Demand<select id="opt-demand">'+demandOptions+'</select></label>' +
        '<label>Preset<select id="opt-preset">'+presetOptions+'</select></label>' +
        '<button type="button" id="opt-save-preset">Save preset</button>' +
        '<button type="button" id="opt-autostaff" class="primary">Auto-staff project</button>' +
      '</div>' +
      '<div class="toolbar">' +
        weightSlider("skill","Skill") + weightSlider("availability","Availability") + weightSlider("seniority","Seniority") + weightSlider("discipline","Discipline") +
        '<span class="hint" id="opt-normalized"></span>' +
      '</div></div>' +
      '<div id="opt-results"></div>' +
      '<div id="opt-autostaff-preview"></div>';

    $("#opt-project", root).onchange = function(){ os.projectId = this.value; os.demandId=""; renderOptimizer(); };
    $("#opt-demand", root).onchange = function(){ os.demandId = this.value; renderOptimizerResults(); };
    ["skill","availability","seniority","discipline"].forEach(function(k){
      $("#w-"+k, root).oninput = function(){ os.weights[k] = parseInt(this.value,10); updateNormalizedLabel(); renderOptimizerResults(); };
    });
    $("#opt-preset", root).onchange = function(){
      var p = STORE.getState().settings.presets.find(function(x){return x.name===this.value;}.bind(this));
      // Presets store the raw, unrestricted slider integers exactly as saved (see setWeightPreset
      // below) - normalization happens only at scoring time, never at storage/restore time. This
      // is what makes 10/10/10/10 restore as 10/10/10/10 rather than a renormalized 25/25/25/25.
      if (p){ os.weights = { skill: p.weights.skill, availability: p.weights.availability, seniority: p.weights.seniority, discipline: p.weights.discipline }; renderOptimizer(); }
    };
    $("#opt-save-preset", root).onclick = function(){
      var name = prompt("Preset name?");
      if (!name) return;
      STORE.setWeightPreset(name, { skill: os.weights.skill, availability: os.weights.availability, seniority: os.weights.seniority, discipline: os.weights.discipline });
      renderOptimizer(); toast("Preset saved");
    };
    $("#opt-autostaff", root).onclick = function(){ runAutoStaff(); };
    updateNormalizedLabel();
    renderOptimizerResults();
  }

  function renderOptimizerResults(){
    var state = STORE.getState();
    var root = $("#opt-results");
    if (!root) return;
    var os = uiState.optimizer;
    var demandsToScore = os.demandId ? state.demands.filter(function(d){return d.id===os.demandId;}) : state.demands.filter(function(d){return d.projectId===os.projectId;});
    if (demandsToScore.length === 0){ root.innerHTML = '<div class="empty-state">No demands for this project.</div>'; return; }

    state._idx = STORE.getIndexes();
    var html = demandsToScore.map(function(demand){
      var ranking = SCORE.rankCandidates(state, demand.id, os.weights);
      var cards = ranking.candidates.slice(0, 15).map(function(c){
        var emp = state.employees.find(function(e){return e.id===c.employeeId;});
        var mods = c.modifiers.map(function(m){ return '<span class="modifier-chip" title="'+esc(m.reason)+'">'+m.name+' '+(m.value>0?'+':'')+m.value+'</span>'; }).join(" ");
        return '<div class="candidate-card">' +
          '<strong>'+esc(emp.name)+'</strong> - matchScore '+c.matchScore+
          ' <button type="button" class="commit-candidate" data-emp="'+c.employeeId+'" data-demand="'+demand.id+'">Commit</button>' +
          ' <button type="button" class="review-candidate" data-emp="'+c.employeeId+'" data-demand="'+demand.id+'">Review</button>' +
          '<div class="subgrid"><span>Skill</span><div class="bar-track"><div class="bar-fill" style="width:'+c.subScores.skill+'%"></div></div><span>'+Math.round(c.subScores.skill)+'</span></div>' +
          '<div class="subgrid"><span>Availability</span><div class="bar-track"><div class="bar-fill" style="width:'+c.subScores.availability+'%"></div></div><span>'+Math.round(c.subScores.availability)+'</span></div>' +
          '<div class="subgrid"><span>Seniority</span><div class="bar-track"><div class="bar-fill" style="width:'+c.subScores.seniority+'%"></div></div><span>'+Math.round(c.subScores.seniority)+'</span></div>' +
          '<div class="subgrid"><span>Discipline</span><div class="bar-track"><div class="bar-fill" style="width:'+c.subScores.discipline+'%"></div></div><span>'+Math.round(c.subScores.discipline)+'</span></div>' +
          (mods ? ('<div>'+mods+'</div>') : '') +
        '</div>';
      }).join("");
      var excludedHtml = ranking.excluded.length ? ('<p class="hint">'+ranking.excluded.length+' candidate(s) excluded: below minimum skill level.</p>') : "";
      return '<div class="card"><h2>'+esc(demand.title)+' ('+demand.openings+' opening(s))</h2>'+excludedHtml+(cards || '<p class="hint">No eligible candidates.</p>')+'</div>';
    }).join("");
    root.innerHTML = html;

    $all(".commit-candidate", root).forEach(function(btn){
      btn.onclick = function(){ commitCandidate(btn.dataset.emp, btn.dataset.demand); };
    });
    $all(".review-candidate", root).forEach(function(btn){
      btn.onclick = function(){ reviewCandidate(btn.dataset.emp, btn.dataset.demand); };
    });
  }

  function commitCandidate(empId, demandId){
    var state = STORE.getState();
    state._idx = STORE.getIndexes();
    var demand = state.demands.find(function(d){return d.id===demandId;});
    var emp = state.employees.find(function(e){return e.id===empId;});
    var r = SCORE.scoreCandidate(state, empId, demandId, uiState.optimizer.weights);
    var alloc = {};
    for (var m in demand.allocationByMonth){
      var need = demand.allocationByMonth[m];
      if (!need) continue;
      var freeAmt = CALC.freeProjected(emp, m, demand.projectId, state._idx, state.settings);
      var give = Math.min(need, freeAmt);
      if (give > 0) alloc[m] = give;
    }
    var asg = ROE.model.newAssignment({ projectId: demand.projectId, employeeId: empId, demandId: demandId, allocationByMonth: alloc, status:"Committed", source:"optimizer", scoreSnapshot: r.matchScore });
    STORE.upsert("assignments", asg);
    renderOptimizerResults();
    toast("Committed " + emp.name + " to " + demand.title);
  }

  function reviewCandidate(empId, demandId){
    var state = STORE.getState();
    state._idx = STORE.getIndexes();

    var r = SCORE.scoreCandidate(state, empId, demandId, uiState.optimizer.weights);

      function(modal){ $("#m-close",modal).onclick = closeModal; }
    );
  }

  function runAutoStaff(){
    var state = STORE.getState();
    var result = SCORE.autoStaff(state, uiState.optimizer.projectId, uiState.optimizer.weights);
    uiState.optimizer.autoStaffPreview = result;
    var root = $("#opt-autostaff-preview");
    var rows = result.proposals.map(function(p, i){
      var emp = state.employees.find(function(e){return e.id===p.employeeId;});
      var demand = state.demands.find(function(d){return d.id===p.demandId;});
      return '<tr><td><input type="checkbox" class="as-accept" data-i="'+i+'" checked aria-label="Accept row '+i+'"></td><td>'+esc(demand.title)+'</td><td>'+esc(emp.name)+'</td><td>'+p.scoreSnapshot+'</td><td>'+esc(JSON.stringify(p.allocationByMonth))+'</td></tr>';
    }).join("");
    var unfilledRows = result.unfilled.map(function(u){
      var demand = state.demands.find(function(d){return d.id===u.demandId;});
      return '<li>'+esc(demand?demand.title:u.demandId)+' opening '+u.opening+': '+esc(u.reason)+'</li>';
    }).join("");
    root.innerHTML =
      '<div class="card"><h2>Auto-staff preview</h2>' +
      (rows ? ('<table><thead><tr><th>Accept</th><th>Demand</th><th>Employee</th><th>Score</th><th>Allocation</th></tr></thead><tbody>'+rows+'</tbody></table>') : '<p class="hint">No proposals could be generated.</p>') +
      (unfilledRows ? ('<h3>Unfilled</h3><ul>'+unfilledRows+'</ul>') : "") +
      (rows ? '<button type="button" id="as-commit-all" class="primary">Commit all accepted</button>' : "") +
      '</div>';
    if (rows){
      $("#as-commit-all", root).onclick = function(){
        var accepted = $all(".as-accept", root).filter(function(cb){return cb.checked;}).map(function(cb){return parseInt(cb.dataset.i,10);});
        accepted.forEach(function(i){
          var p = result.proposals[i];
          STORE.upsert("assignments", Object.assign({}, p, { status: "Committed" }));
        });
        uiState.optimizer.autoStaffPreview = null;
        root.innerHTML = "";
        renderOptimizerResults();
        toast(accepted.length + " assignment(s) committed");
      };
    }
  }

  /* =========================== TIMELINE =========================== */
  function renderTimeline(){
    var state = STORE.getState();
    var root = $("#panel-timeline");
    var idx = STORE.getIndexes();
    var months = U.monthKeys(state.settings.horizonStart, state.settings.horizonMonths);
    var mode = uiState.timeline.mode;

    function band(pct){
      if (pct > 115) return "cell-critical";
      if (pct > 100) return "cell-over";
      if (pct >= 60) return "cell-target";
      return "cell-under";
    }

    var rowsHtml;
    if (mode === "employee"){
      rowsHtml = state.employees.filter(function(e){return e.active;}).map(function(e){
        var cells = months.map(function(m){
          var c = CALC.committed(e.id, m, idx);
          var projs = Array.from((idx.byEmployeeMonth.get(e.id)||new Map()).get(m)?.projectIds || []);
          var names = projs.map(function(pid){ var p=state.projects.find(function(x){return x.id===pid;}); return p?p.name:pid; }).join(", ");
          return '<td class="'+band(c)+'" title="'+esc(names)+'">'+Math.round(c)+'%</td>';
        }).join("");
        return '<tr><td>'+esc(e.name)+'</td>'+cells+'</tr>';
      }).join("");
    } else {
      rowsHtml = state.projects.map(function(p){
        var cells = months.map(function(m){
          var rec = (idx.byProjectMonth.get(p.id)||new Map()).get(m);
          var pct = rec ? rec.pct : 0;
          var size = rec ? rec.employeeIds.size : 0;
          return '<td class="'+band(pct)+'" title="'+size+' employee(s)">'+Math.round(pct)+'%</td>';
        }).join("");
        return '<tr><td>'+esc(p.name)+'</td>'+cells+'</tr>';
      }).join("");
    }

    root.innerHTML =
      '<div class="card"><div class="toolbar">' +
        '<label>Rows<select id="tl-mode"><option value="employee" '+(mode==="employee"?"selected":"")+'>Employees</option><option value="project" '+(mode==="project"?"selected":"")+'>Projects</option></select></label>' +
      '</div><div style="overflow-x:auto;"><table><thead><tr><th>'+(mode==="employee"?"Employee":"Project")+'</th>'+months.map(function(m){return '<th>'+m+'</th>';}).join("")+'</tr></thead><tbody>'+rowsHtml+'</tbody></table></div></div>' +
      '<div class="card"><h2>Context-switch tax by month</h2><canvas id="chart-ctxtax" height="90"></canvas></div>';

    $("#tl-mode", root).onchange = function(){ uiState.timeline.mode = this.value; renderTimeline(); };

    if (window.Chart){
      var activeEmployees = state.employees.filter(function(e){return e.active;});
      var concurrentSeries = months.map(function(m){ return U.mean(activeEmployees.map(function(e){ return CALC.concurrentProjectsAt(e.id, m, idx); })); });
      var taxSeries = months.map(function(m){ return U.mean(activeEmployees.map(function(e){ return CALC.ctxTaxPct(CALC.concurrentProjectsAt(e.id,m,idx), state.settings); })); });
      var ctx = $("#chart-ctxtax").getContext("2d");
      if (root._chart) root._chart.destroy();
      root._chart = new Chart(ctx, {
        type: "line",
        data: { labels: months, datasets: [
          { label:"Avg concurrent projects", data: concurrentSeries, borderColor:"#4f8cff", yAxisID:"y" },
          { label:"Avg ctx-tax %", data: taxSeries, borderColor:"#f2994a", yAxisID:"y1" }
        ]},
        options: { responsive:true, scales:{ y:{ position:"left" }, y1:{ position:"right", grid:{drawOnChartArea:false} } } }
      });
    } else {
      $("#chart-ctxtax", root).outerHTML = '<p class="hint">Chart.js unavailable - chart disabled.</p>';
    }
  }

  /* =========================== ALERTS =========================== */
  function renderAlerts(){
    var state = STORE.getState();
    var root = $("#panel-alerts");
    var th = state.settings.alertThresholds;
    var results = uiState.alerts.results || ALERTS.scan(state, th);
    uiState.alerts.results = results;

    var f = uiState.alerts;
    var byId = {}; state.employees.forEach(function(e){ byId[e.id]=e; });
    var filtered = results.filter(function(a){
      if (f.severity && a.severity !== f.severity) return false;
      if (f.rule && a.ruleId !== f.rule) return false;
      if (f.text){
        var subj = a.subjectType==="employee" ? (byId[a.subjectId]||{}).name : a.subjectId;
        if ((subj||"").toLowerCase().indexOf(f.text.toLowerCase()) === -1 && a.message.toLowerCase().indexOf(f.text.toLowerCase()) === -1) return false;
      }
      return true;
    });

    var order = { CRITICAL:0, HIGH:1, MEDIUM:2, LOW:3 };

        thresholdInput("targetSlackPct","Target slack %",th.targetSlackPct) + thresholdInput("benchGapPct","Bench gap %",th.benchGapPct) + thresholdInput("benchMonths","Bench months",th.benchMonths) +
      '</div></fieldset>' +
      '<table><thead><tr><th>Severity</th><th>Rule</th><th>Subject</th><th>Message</th><th>Actions</th></tr></thead><tbody>'+(rows||'<tr><td colspan="5">No alerts.</td></tr>')+'</tbody></table>' +

  function runScanWithProgress(){

  // ---------- API connector: per-entity settings helpers (live-read, never a stale closure) ----------
  function updateApiField(patch){
    var live = STORE.getState().settings.api;
    STORE.setSettings({ api: Object.assign({}, live, patch) });
  }
  function updateApiEntity(entityName, patch){
    var live = STORE.getState().settings.api;
    var entities = Object.assign({}, live.entities);
    entities[entityName] = Object.assign({}, entities[entityName], patch);
    STORE.setSettings({ api: Object.assign({}, live, { entities: entities }) });
  }
  function setApiFieldMapping(entityName, mapping){
    var live = STORE.getState().settings.api;
    var fieldMappings = Object.assign({}, live.fieldMappings);
    fieldMappings[entityName] = mapping;
    STORE.setSettings({ api: Object.assign({}, live, { fieldMappings: fieldMappings }) });
  }

  // ---------- API connector: per-entity UI block (enable, paths, mapping editor, pull/push) ----------

        '<label>Remote path<input type="text" class="map-path" data-entity="'+name+'" data-orig="'+esc(field)+'" value="'+esc(mapping[field])+'"></label>' +
        '<button type="button" class="map-remove" data-entity="'+name+'" data-field="'+esc(field)+'">Remove</button>' +
      '</div>';
    }).join("");
    var fieldOptions = entityDef.fields.map(function(f){ return '<option value="'+esc(f)+'">'; }).join("");
    return (
      '<fieldset><legend>'+esc(entityDef.label)+'</legend>' +
      '<label><input type="checkbox" class="api-ent-enabled" data-entity="'+name+'" '+(cfg.enabled?'checked':'')+'> Enabled</label>' +
