        '<label>Pull path<input type="text" class="api-ent-pullPath" data-entity="'+name+'" value="'+esc(cfg.pullPath||"")+'"></label>' +
        '<label>Push path<input type="text" class="api-ent-pushPath" data-entity="'+name+'" value="'+esc(cfg.pushPath||"")+'"></label>' +
        '<label>Response root (dot path, blank = array at root)<input type="text" class="api-ent-responseRoot" data-entity="'+name+'" value="'+esc(cfg.responseRoot||"")+'"></label>' +
        '<label>ID field<input type="text" class="api-ent-idField" data-entity="'+name+'" value="'+esc(cfg.idField||"id")+'"></label>' +
        fieldSelect("api-ent-pushMethod-"+name, "Push method", ["POST","PUT"], cfg.pushMethod||"POST").replace('id="api-ent-pushMethod-'+name+'"', 'id="api-ent-pushMethod-'+name+'" class="api-ent-pushMethod" data-entity="'+name+'"') +
        fieldSelect("api-ent-pushMode-"+name, "Push mode", ["bulk","perRecord"], cfg.pushMode||"bulk").replace('id="api-ent-pushMode-'+name+'"', 'id="api-ent-pushMode-'+name+'" class="api-ent-pushMode" data-entity="'+name+'"') +
      '</div>' +
      '<div class="hint">Field mapping (canonical field -> dot-path on the remote record). Fields left unmapped pass through untouched.</div>' +
      '<datalist id="api-fields-'+name+'">'+fieldOptions+'</datalist>' +
      '<div class="mapping-rows" data-entity="'+name+'">' + mappingRows + '</div>' +
      '<div class="row">' +
        '<label>New field<input type="text" class="map-field-new" list="api-fields-'+name+'" data-entity="'+name+'" placeholder="canonical field"></label>' +
        '<label>Remote path<input type="text" class="map-path-new" data-entity="'+name+'" placeholder="dot.path.on.remote"></label>' +

  function wireApiEntity(root, entityDef){
    var name = entityDef.name;
    $(".api-ent-enabled[data-entity='"+name+"']", root).onchange = function(){ updateApiEntity(name, { enabled: this.checked }); };
    $(".api-ent-pullPath[data-entity='"+name+"']", root).onchange = function(){ updateApiEntity(name, { pullPath: this.value }); };
    $(".api-ent-pushPath[data-entity='"+name+"']", root).onchange = function(){ updateApiEntity(name, { pushPath: this.value }); };
    $(".api-ent-responseRoot[data-entity='"+name+"']", root).onchange = function(){ updateApiEntity(name, { responseRoot: this.value }); };
    $(".api-ent-idField[data-entity='"+name+"']", root).onchange = function(){ updateApiEntity(name, { idField: this.value || "id" }); };
    $("#api-ent-pushMethod-"+name, root).onchange = function(){ updateApiEntity(name, { pushMethod: this.value }); };
    $("#api-ent-pushMode-"+name, root).onchange = function(){ updateApiEntity(name, { pushMode: this.value }); };

    $all(".map-field[data-entity='"+name+"']", root).forEach(function(inp){
      inp.onchange = function(){
        var orig = this.dataset.orig;
        var newField = this.value.trim();
        var mapping = Object.assign({}, STORE.getState().settings.api.fieldMappings[name] || {});
        var path = mapping[orig];
        delete mapping[orig];
        if (newField) mapping[newField] = path || "";
        setApiFieldMapping(name, mapping);
        renderSettings();
      };
    });
    $all(".map-path[data-entity='"+name+"']", root).forEach(function(inp){
      inp.onchange = function(){
        var field = this.dataset.orig;
        var mapping = Object.assign({}, STORE.getState().settings.api.fieldMappings[name] || {});
        mapping[field] = this.value;
        setApiFieldMapping(name, mapping);
      };
    });
    $all(".map-remove[data-entity='"+name+"']", root).forEach(function(btn){
      btn.onclick = function(){
        var field = this.dataset.field;
        var mapping = Object.assign({}, STORE.getState().settings.api.fieldMappings[name] || {});
        delete mapping[field];
        setApiFieldMapping(name, mapping);
        renderSettings();
      };
    });
    var newFieldInput = $(".map-field-new[data-entity='"+name+"']", root);
    var newPathInput = $(".map-path-new[data-entity='"+name+"']", root);
    $(".map-add[data-entity='"+name+"']", root).onclick = function(){
      var field = (newFieldInput.value||"").trim();
      var path = (newPathInput.value||"").trim();
      if (!field){ toast("Enter a canonical field name"); return; }
      var mapping = Object.assign({}, STORE.getState().settings.api.fieldMappings[name] || {});
      mapping[field] = path;
      setApiFieldMapping(name, mapping);
      renderSettings();
    };

    $("#api-pull-"+name, root).onclick = function(){ apiPullPreview(name, entityDef); };
    $("#api-push-"+name, root).onclick = function(){ apiPushPreview(name, entityDef); };
  }

  function handleImportFile(file){
    if (!file) return;
    var root = $("#import-preview");
    IO.readWorkbookFile(file).then(function(sheets){
      uiState.importSession.sheets = sheets;
      var state = STORE.getState();
      var mappings = {};
      var needsMappingHtml = "";
      // Fix round 2: parse the file's own CustomFieldDefs sheet (if any) up front so canonical
      // header detection can reserve custom-field columns BEFORE fuzzy-matching canonical fields
      // against them - otherwise a deleted canonical column lets fuzzy matching steal a genuine
      // custom column out from under it (MGR-E). Only successfully-parsed rows count here, so a
      // rejected CustomFieldDefs row never reserves (or shifts) a column either.
      var cfdForMapping = sheets.CustomFieldDefs ? IO.parseCustomFieldDefsSheet(sheets.CustomFieldDefs).records : [];
      Object.keys(IO.COLUMNS).forEach(function(sheetName){
        if (sheetName === "Meta" || sheetName === "CustomFieldDefs" || !sheets[sheetName]) return;
        var headers = sheets[sheetName][0] || [];
        var entityType = IO.ENTITY_TYPE_BY_SHEET[sheetName];
        var defsForSheet = entityType ? IO.customDefsFor(cfdForMapping, entityType) : [];
        var detected = IO.detectMapping(sheetName, headers, defsForSheet);
        var unresolved = Object.keys(detected).filter(function(f){ return !detected[f]; });
        mappings[sheetName] = {};
        Object.keys(detected).forEach(function(f){ mappings[sheetName][f] = detected[f]; });
        if (unresolved.length){
          needsMappingHtml += '<div class="card"><h3>'+sheetName+' - map columns</h3>' + unresolved.map(function(f){
            var options = ['<option value="">&lt;ignore&gt;</option>'].concat(headers.map(function(h){ return '<option value="'+esc(h)+'">'+esc(h)+'</option>'; }));
            return '<label>'+f+'<select class="map-select" data-sheet="'+sheetName+'" data-field="'+f+'">'+options.join("")+'</select></label>';
          }).join("") + '</div>';
        }
      });
      uiState.importSession.mappings = mappings;
      root.innerHTML = needsMappingHtml + '<button type="button" id="btn-preview-import">Preview import</button>';
      $all(".map-select", root).forEach(function(sel){
        sel.onchange = function(){ uiState.importSession.mappings[sel.dataset.sheet][sel.dataset.field] = sel.value || null; };
      });
      $("#btn-preview-import", root).onclick = function(){ previewImport(); };
    }).catch(function(err){ toast("Failed to read workbook: " + (err.message||err)); });
  }

  function previewImport(){
    var root = $("#import-preview");
    var state = STORE.getState();
    var parsed = IO.parseWorkbook(uiState.importSession.sheets, state.settings, uiState.importSession.mappings, state.customFieldDefs);
    uiState.importSession.parsed = parsed;
    var summary = IO.diffAgainstState(state, parsed);
    var rows = Object.keys(summary).map(function(sheet){
      var s = summary[sheet];
      return '<tr><td>'+sheet+'</td><td>'+s.insert+'</td><td>'+s.update+'</td><td>'+s.skipped+'</td><td>'+s.errors+'</td></tr>';
    }).join("");
    var errorList = [];
    Object.keys(parsed.bySheet).forEach(function(sheet){ parsed.bySheet[sheet].errors.forEach(function(e){ errorList.push(sheet+" row "+e.row+" ["+e.field+"]: "+e.message); }); });
    var warnHtml = parsed.monthWarnings.length ? ('<p class="hint">Out-of-horizon month columns skipped: ' + parsed.monthWarnings.map(function(w){return w.sheet+": "+w.headers.join(", ");}).join(" | ") + '</p>') : "";
    root.insertAdjacentHTML("beforeend",
      '<div class="card"><h3>Preview</h3><table><thead><tr><th>Sheet</th><th>Insert</th><th>Update</th><th>Skip</th><th>Errors</th></tr></thead><tbody>'+rows+'</tbody></table>' +
      warnHtml +
      (errorList.length ? ('<div class="hint">'+errorList.slice(0,50).map(esc).join("<br>")+'</div>') : "") +
      '<button type="button" id="btn-apply-import" class="primary">Apply import</button></div>'
    );
    $("#btn-apply-import", root).onclick = applyImport;
  }

  function applyImport(){
    var parsed = uiState.importSession.parsed;
    if (!parsed) return;
    // IO-1: recreate any custom field defs found in the file but missing locally FIRST, so the
    // records applied right after already have a matching def to display under (a def missing
    // locally never blocks/loses a record's custom values either way - CF-4 permits unknown keys).
    if (parsed.fieldDefs && parsed.fieldDefs.toAdd.length){
      STORE.restoreFieldDefs(parsed.fieldDefs.toAdd);
    }
    var map = { Employees:"employees", Skills:"skills", Projects:"projects", ProjectDemands:"demands", Assignments:"assignments", Mentorships:"mentorships" };
    Object.keys(map).forEach(function(sheet){
      var r = parsed.bySheet[sheet];
      if (!r) return;
      r.records.forEach(function(rec){ STORE.upsert(map[sheet], rec); });
    });
    if (parsed.bySheet.EmployeeSkills){
      parsed.bySheet.EmployeeSkills.records.forEach(function(rec){ STORE.upsertEmployeeSkill(rec); });
    }
    $("#import-preview").innerHTML = "";
    renderAll();
    toast("Import applied");
  }

  // Generic pull preview, operates on whichever entity's Pull button was clicked - not hardcoded
  // to employees. Works for any of the 5 entities in API_ENTITIES as long as it is enabled.
  function apiPullPreview(entityName, entityDef){
    var state = STORE.getState();
    var s = state.settings;
    var idField = (s.api.entities[entityName] || {}).idField || "id";
    API.pull(s.api, entityName, s.api.fieldMappings[entityName] || {}).then(function(remote){
      var snap = STORE.getLastPulledSnapshot(entityName);
      var diff = API.diffPull(state[entityName], remote, snap, idField);
      var root = $("#api-preview");
      root.innerHTML = '<div class="card"><h3>Pull preview - '+esc(entityDef.label)+'</h3>' +
        '<p>'+diff.adds.length+' add(s), '+diff.updates.length+' update(s), '+diff.unchanged.length+' unchanged.</p>' +
        '<button type="button" id="api-apply-pull" class="primary">Apply</button> <button type="button" id="api-cancel-pull">Cancel</button></div>';
      $("#api-cancel-pull", root).onclick = function(){ root.innerHTML = ""; toast("Pull cancelled - nothing changed"); };
      $("#api-apply-pull", root).onclick = function(){
        diff.adds.forEach(function(a){ STORE.upsert(entityName, entityDef.factory(Object.assign({ id:a.id }, a.remote))); });
        diff.updates.filter(function(u){ return u.applyRemote; }).forEach(function(u){
          var rec = STORE.getState()[entityName].find(function(r){return r.id===u.id;});
          var patch = {}; u.fields.forEach(function(f){ patch[f.field] = f.after; });
          STORE.upsert(entityName, Object.assign({}, rec, patch, { id: u.id }));
        });
        var byId = {}; remote.forEach(function(r){ byId[r.id] = r; });
        STORE.setLastPulledSnapshot(entityName, byId);
        root.innerHTML = "";
        renderAll();
        toast("Pull applied");
      };
    }).catch(function(err){
      toast((err && err.isCors ? "CORS error: " : "Pull failed: ") + (err.message||err));
    });
  }

  // Generic push preview, same idea as apiPullPreview above but for Push.
  function apiPushPreview(entityName, entityDef){
    var state = STORE.getState();
    var s = state.settings;
    var idField = (s.api.entities[entityName] || {}).idField || "id";
    var snap = STORE.getLastPulledSnapshot(entityName);
    var diff = API.diffPush(state[entityName], snap, idField);
    var root = $("#api-preview");
    root.innerHTML = '<div class="card"><h3>Push preview - '+esc(entityDef.label)+'</h3><p>'+diff.toCreate.length+' to create, '+diff.toUpdate.length+' to update.</p>'+
      '<button type="button" id="api-send-push" class="primary">Send</button></div>';
    $("#api-send-push", root).onclick = function(){
      API.push(s.api, entityName, diff.toCreate.concat(diff.toUpdate)).then(function(){
        toast("Push complete"); root.innerHTML = "";
      }).catch(function(err){ toast((err && err.isCors ? "CORS error: " : "Push failed: ") + (err.message||err)); });
    };
  }

  /* =========================== BOOTSTRAP =========================== */
  function wireTopbar(){
    $("#btn-load-demo").onclick = function(){
      STORE.loadDemoData();
      uiState.alerts.results = null;
      renderAll();
      toast("Demo data loaded");
    };
    $("#btn-clear-all").onclick = clearAllFlow;
  }

  function wireNav(){
    $all("#nav a").forEach(function(a){
      a.addEventListener("click", function(e){ e.preventDefault(); navigate(a.dataset.panel); });
    });
    window.addEventListener("hashchange", function(){ navigate(location.hash.slice(1)); });
  }

  function boot(){
    updateVendorBanner();
    wireTopbar();
    wireNav();
    STORE.load().then(function(res){
      updateSessionBadge();
      var initial = location.hash ? location.hash.slice(1) : "overview";
      navigate(initial);
      if (res && res.fellBackToSessionOnly){
        toast("IndexedDB unavailable - running in session-only mode");
      }
    });
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }

  return {
    navigate: navigate, renderAll: renderAll, toast: toast,
    openEmployeeModal: openEmployeeModal, openProjectModal: openProjectModal,
    _uiState: uiState
  };
})();
</script>
</body>
</html>
